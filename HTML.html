<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicadores de Performance - MBS BRASIL</title>
<style>
  :root {
    --navy: #16234a;
    --navy-deep: #0d1730;
    --navy-soft: #3a4a75;
    --red: #d6301f;
    --red-deep: #ad2617;
    --gold: #c6a15c;
    --gold-deep: #9c7a3d;
    --green: #43a047;
    --yellow: #e8a945;
    --bg: #eef1f6;
    --card: #ffffff;
    --border: #e4e8f0;
    --text-navy: #16234a;
    --text-gray: #8792a3;
    --text-gray-dark: #4b5768;
    --radius: 4px;
    --font: "Segoe UI", Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text-navy);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .top-header {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    padding: 4px 10px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    flex-shrink: 0;
  }
  .brand-logo-wrap { display: flex; align-items: center; flex-shrink: 0; min-width: 80px; }
  .brand-logo-wrap img { height: 28px; width: auto; display: block; }
  .dash-title {
    flex: 1; text-align: center; font-size: clamp(14px, 2.5vw, 22px); font-weight: 800;
    letter-spacing: 0.5px; color: var(--navy); margin: 0; text-transform: uppercase;
  }
  .meta-boxes { display: flex; gap: 6px; flex-shrink: 0; padding-right: 40px; z-index: 2; align-items: center; }
  .meta-box {
    display: flex; align-items: center; gap: 4px; background: var(--bg);
    border-radius: 4px; padding: 3px 8px; border: 1px solid var(--border);
  }
  .meta-box .icon { width: 14px; height: 14px; color: var(--navy); flex-shrink: 0; }
  .meta-text { display: flex; flex-direction: column; line-height: 1.1; }
  .meta-label { font-size: 8px; font-weight: 700; color: var(--text-gray); text-transform: uppercase; }
  .meta-value { font-size: 11px; font-weight: 800; color: var(--navy); white-space: nowrap; }

  /* NAVEGAÇÃO ENTRE PÁGINAS */
  .nav-toggle {
    display: flex; gap: 4px; margin-right: 8px;
    background: #edf1f5; padding: 3px; border-radius: 4px; border: 1px solid var(--border);
  }
  .nav-btn {
    background: transparent; border: none; border-radius: 3px; padding: 3px 12px;
    font-size: 9px; font-weight: 800; color: var(--text-gray-dark); cursor: pointer; transition: 0.2s ease;
  }
  .nav-btn:hover { background: #e4e8f0; }
  .nav-btn.active { background: var(--navy); color: #ffffff; }

  .view-toggle {
    display: flex; gap: 4px; margin-right: 8px;
    background: #edf1f5; padding: 3px; border-radius: 4px; border: 1px solid var(--border);
  }
  .view-btn {
    background: transparent; border: none; border-radius: 3px; padding: 3px 10px;
    font-size: 9px; font-weight: 800; color: var(--text-gray-dark);
    cursor: pointer; transition: 0.2s ease;
  }
  .view-btn:hover { background: #e4e8f0; }
  .view-btn.active { background: var(--gold); color: #ffffff; }

  .brand-stripes { position: absolute; right: 0; top: 0; width: 40px; height: 100%; overflow: hidden; z-index: 1; }
  .brand-stripes span { position: absolute; width: 14px; height: 180%; top: -40%; transform: rotate(18deg); }
  .brand-stripes span:nth-child(1) { background: var(--navy); left: -6px; }
  .brand-stripes span:nth-child(2) { background: var(--gold); left: 12px; }
  .brand-stripes span:nth-child(3) { background: var(--red); left: 28px; }
  .stripe-divider { height: 2px; flex-shrink: 0; background: linear-gradient(90deg, var(--navy) 0%, var(--navy) 72%, var(--gold) 72%, var(--gold) 91%, var(--red) 91%, var(--red) 100%); }

  /* ===== LAYOUT PRINCIPAL E TRANSIÇÃO DE PÁGINAS ===== */
  .dashboard-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .dashboard-page {
    display: none;
    flex: 1;
    min-height: 0;
    animation: fadeSwitch 0.4s ease-in-out;
  }

  .dashboard-page.active {
    display: flex;
  }

  @keyframes fadeSwitch {
    0% { opacity: 0; transform: translateY(5px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ===== PÁGINA 1: GRID ===== */
  #page-1.active {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto 1fr 1fr;
    gap: 4px;
    padding: 4px;
  }

  /* Banner da Página 1 — texto rolante, selo fixo à esquerda */
  .page1-banner {
    grid-column: 1 / 3;
    grid-row: 1;
    padding: 6px 0 6px 14px;
    background: linear-gradient(90deg, var(--navy-deep) 0%, var(--navy) 60%, var(--navy-soft) 100%);
    color: #ffffff;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.35;
    border-radius: var(--radius);
    border-left: 4px solid var(--gold);
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }
  .page1-banner .banner-label {
    background: var(--gold);
    color: var(--navy-deep);
    font-size: 8px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    text-transform: uppercase;
    z-index: 2;
    position: relative;
  }
  .page1-banner .banner-marquee {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .page1-banner .banner-track {
    display: inline-block;
    white-space: nowrap;
    animation: textoMarquee 30s linear infinite;
    will-change: transform;
  }
  .page1-banner .banner-marquee:hover .banner-track {
    animation-play-state: paused;
  }
  .page1-banner[hidden] { display: none !important; }

  @keyframes textoMarquee {
    0%   { transform: translateX(0); }
    100% { transform: translateX(var(--marquee-shift, -50%)); }
  }

  .panel {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(16,24,40,0.02);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .panel-vol { grid-column: 1 / 3; grid-row: 2; }
  .panel-est { grid-column: 1 / 2; grid-row: 3; }
  .panel-tat { grid-column: 2 / 3; grid-row: 3; }
  .panel-exp { grid-column: 1 / 2; grid-row: 4; }
  .panel-sac { grid-column: 2 / 3; grid-row: 4; }

  @media (min-width: 1025px) {
    #page-1.sac-hidden .panel-exp { grid-column: 1 / 3; }
  }

  /* Texto do indicador dentro de cada seção (Página 2) — rolante */
  .op-section-texto {
    font-size: 10px;
    color: var(--text-gray-dark);
    padding: 4px 0 4px 8px;
    background: #f8fafc;
    border-left: 3px solid var(--gold);
    border-radius: 3px;
    margin-bottom: 3px;
    line-height: 1.3;
    font-weight: 500;
    flex-shrink: 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .op-section-texto .op-texto-track {
    display: inline-block;
    white-space: nowrap;
    animation: textoMarquee 30s linear infinite;
    will-change: transform;
  }
  .op-section-texto:hover .op-texto-track {
    animation-play-state: paused;
  }

  .panel-header {
    padding: 2px 6px;
    font-size: 9px;
    font-weight: 800;
    color: #fff;
    text-transform: uppercase;
    position: relative;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-header.navy { background: var(--navy); }
  .panel-header.red { background: var(--red); }
  .panel-header .header-deco { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; opacity: 0.2; color: #fff; }

  .panel-body {
    padding: 3px 4px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: hidden;
    min-height: 0;
  }

  /* ===== PÁGINA 2: CARDS DUAS LINHAS (GRID HORIZONTAL) ===== */
  #page-2 {
    flex-direction: column;
    gap: 8px;
    padding: 8px 12px;
    overflow: hidden;
    background: var(--bg);
  }

  .op-row-section {
    background: transparent;
    border: none;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1 1 0;
    min-height: 0;
  }

  .op-row-header {
    background: var(--navy);
    color: #ffffff;
    padding: 0 4px 3px 4px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
  }

  .op-row-header .icon { width: 14px; height: 14px; color: #ffffff; flex-shrink: 0; }

  .op-cards-wrapper {
    display: grid;
    grid-template-rows: repeat(2, 1fr);
    grid-auto-flow: column;
    gap: 8px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .op-card-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 4px;
    box-shadow: 0 2px 6px rgba(16,24,40,0.03);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .op-card-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(16,24,40,0.06);
  }

  .op-card-item::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .op-card-item.status-green::before { background: var(--green); }
  .op-card-item.status-yellow::before { background: var(--yellow); }
  .op-card-item.status-red::before { background: var(--red); }
  .op-card-item.status-gray::before { background: #a0aab8; }

  .op-card-bottom {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: #f8fafc;
    margin: 0 -10px -8px -10px;
    padding: 5px 10px;
    border-top: 1px dashed #e4e8f0;
    flex-shrink: 0;
  }

  .op-card-val-row { display: flex; justify-content: space-between; align-items: center; }
  .op-card-val { font-size: 14px; font-weight: 800; color: var(--navy); line-height: 1; }
  .op-card-meta { font-size: 8px; color: var(--text-gray); font-weight: 700; text-transform: uppercase; }

  .op-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px #fff;
  }

  /* ===== VOLUMETRIA NOS CARDS (PÁGINA 2) ===== */
  .op-card-volum {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 3px;
    padding: 4px 5px;
    background: #f8fafc;
    border: 1px dashed #e4e8f0;
    border-radius: 4px;
    margin-top: 2px;
  }

  .op-vol-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    text-align: center;
    min-width: 0;
  }

  .op-vol-lbl {
    font-size: 6px;
    color: #a7afbd;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    line-height: 1;
  }

  .op-vol-val {
    font-size: 9px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .op-vol-val.up { color: var(--green); }
  .op-vol-val.down { color: var(--red); }
  .op-vol-val.flat { color: var(--text-gray-dark); }

  /* ===== DENTRO / FORA (PÁGINA 2) ===== */
  .op-card-dentro-fora {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px 6px;
    background: #f8fafc;
    border: 1px dashed #e4e8f0;
    border-radius: 4px;
    margin-top: 2px;
  }

  .op-df-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    text-align: center;
    min-width: 0;
  }

  .op-df-lbl {
    font-size: 6px;
    color: #a7afbd;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    line-height: 1;
  }

  .op-df-val {
    font-size: 11px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .op-card-ind-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1;
  }

  .op-card-ind-lbl {
    font-size: 6px;
    color: #a7afbd;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 1px;
  }

  .op-card-bottom .op-card-val {
    font-size: 16px;
  }

  /* ============================================================
     CARD OPERACIONAL — VISÃO FECHADA (COMPACTA)
     ============================================================ */
  .op-card-item {
    cursor: pointer;
    padding: 10px 12px;
    gap: 6px;
  }
  .op-card-item:active { transform: translateY(0) scale(0.99); }

  .op-card-label {
    font-size: 10px;
    font-weight: 800;
    color: var(--text-gray-dark);
    line-height: 1.25;
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 24px;
  }

  .op-card-pct-big {
    font-size: 26px;
    font-weight: 900;
    color: var(--navy);
    line-height: 1;
    text-align: center;
    letter-spacing: -0.5px;
    margin: auto 0;
  }
  .op-card-item.status-green  .op-card-pct-big { color: var(--green); }
  .op-card-item.status-yellow .op-card-pct-big { color: var(--yellow); }
  .op-card-item.status-red    .op-card-pct-big { color: var(--red); }
  .op-card-item.status-gray   .op-card-pct-big { color: var(--text-gray-dark); }

  .op-card-pct-cap {
    text-align: center;
    font-size: 8px;
    font-weight: 700;
    color: var(--text-gray);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: -2px;
  }

  .op-card-total-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 9px;
    background: #f8fafc;
    border: 1px dashed var(--border);
    border-radius: 4px;
    font-size: 9px;
    font-weight: 800;
    color: var(--text-gray);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .op-card-total-line .v {
    color: var(--navy);
    font-weight: 900;
    font-size: 13px;
    text-transform: none;
    letter-spacing: 0;
  }

  .op-card-meta-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 9px;
    background: #fff7e6;
    border: 1px solid #f0dba8;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 800;
    color: var(--gold-deep);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .op-card-meta-line .v {
    color: var(--gold-deep);
    font-weight: 900;
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
  }
  .op-card-meta-line.no-meta {
    background: #f1f4f9;
    border-color: var(--border);
    color: var(--text-gray);
  }
  .op-card-meta-line.no-meta .v { color: var(--text-gray-dark); }

  /* ============================================================
     MODAL DO CARD OPERACIONAL — VISÃO ABERTA
     ============================================================ */
  .op-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 23, 48, 0.65);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: opOverlayIn 0.18s ease;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  @keyframes opOverlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes opModalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .op-modal {
    background: var(--card);
    border-radius: 10px;
    width: 100%;
    max-width: 820px;
    max-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,0.45);
    animation: opModalIn 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
    border: 1px solid var(--border);
    position: relative;   /* ⭐ ancora .op-modal-side-nav dentro do modal */
  }

  .op-modal-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    background: linear-gradient(90deg, var(--navy-deep) 0%, var(--navy) 65%, var(--navy-soft) 100%);
    color: #fff;
    border-bottom: 3px solid var(--gold);
    flex-shrink: 0;
  }
  .op-modal-header-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex: 1;
  }
  .op-modal-header-info h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.3px;
    line-height: 1.25;
    word-break: break-word;
  }
  .op-modal-header-info .sub {
    font-size: 9px;
    font-weight: 700;
    color: #cdd6e5;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .op-modal-close {
    background: rgba(255,255,255,0.14);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    width: 34px;
    height: 34px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    line-height: 1;
    padding: 0;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .op-modal-close:hover {
    background: var(--red);
    border-color: var(--red);
    transform: scale(1.06);
  }

  .op-modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px 20px;
    background: #f8fafc;
  }
  .op-modal-body::-webkit-scrollbar { width: 10px; }
  .op-modal-body::-webkit-scrollbar-track { background: #eef1f6; }
  .op-modal-body::-webkit-scrollbar-thumb {
    background: #b9c2d0; border-radius: 5px;
    border: 2px solid #eef1f6;
  }
  .op-modal-body::-webkit-scrollbar-thumb:hover { background: var(--navy-soft); }

  .op-modal-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 20px 14px 16px;
    background: linear-gradient(135deg, #f8fafc 0%, #eef1f6 100%);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .op-modal-hero .pct {
    font-size: 48px;
    font-weight: 900;
    line-height: 1;
    color: var(--navy);
    letter-spacing: -1px;
  }
  .op-modal-hero.status-green  .pct { color: var(--green); }
  .op-modal-hero.status-yellow .pct { color: var(--yellow); }
  .op-modal-hero.status-red    .pct { color: var(--red); }
  .op-modal-hero.status-gray   .pct { color: var(--text-gray-dark); }
  .op-modal-hero .caption {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-gray);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .op-modal-hero .meta-line {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 800;
    margin-top: 4px;
  }
  .op-modal-hero .meta-line .lbl {
    color: var(--text-gray);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .op-modal-section {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .op-modal-section-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--navy);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-left: 4px solid var(--gold);
  }

  .op-modal-grid {
    display: grid;

   NOVO MODAL — BLOCOS ESTRUTURADOS (v2)

/* Ajustes no corpo do modal — mais respiro entre blocos */
.op-modal-body { padding: 18px 20px 22px; background: #f4f6fa; }

/* Bloco genérico */
.op-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(16,24,40,0.04);
}
.op-block:last-child { margin-bottom: 0; }

.op-block-label {
  background: var(--navy);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  padding: 7px 14px;
  border-left: 4px solid var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ─── BLOCO 1 — ONDE ESTAMOS ─────────────────────────────── */
.op-block1.status-green  { border-left: 4px solid var(--green); }
.op-block1.status-yellow { border-left: 4px solid var(--yellow); }
.op-block1.status-red    { border-left: 4px solid var(--red); }
.op-block1.status-gray   { border-left: 4px solid #a0aab8; }

.op-block1.status-green  .op-anchor-value { color: var(--green); }
.op-block1.status-yellow .op-anchor-value { color: var(--gold-deep); }
.op-block1.status-red    .op-anchor-value { color: var(--red); }
.op-block1.status-gray   .op-anchor-value { color: var(--text-gray-dark); }

.op-block1-grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 0;
}

/* Lado esquerdo — âncora grande */
.op-anchor {
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-right: 1px dashed var(--border);
  background: linear-gradient(135deg, #fbfcfe 0%, #f4f6fa 100%);
}

.op-anchor-value {
  font-size: 52px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1.5px;
  font-variant-numeric: tabular-nums;
  color: var(--navy);
}
.op-anchor-unit {
  font-size: 16px;
  font-weight: 500;
  font-style: italic;
  opacity: 0.6;
  margin-left: 6px;
  letter-spacing: 0;
}

.op-anchor-caption {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-gray);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-top: 6px;
}

.op-anchor-gauge {
  width: 100%;
  max-width: 240px;
  height: 8px;
  background: #e8ecf3;
  border-radius: 4px;
  margin-top: 14px;
  position: relative;
  overflow: visible;
}
.op-anchor-gauge-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--navy);
  transition: width 0.4s ease;
}
.op-block1.status-green  .op-anchor-gauge-fill { background: var(--green); }
.op-block1.status-yellow .op-anchor-gauge-fill { background: var(--yellow); }
.op-block1.status-red    .op-anchor-gauge-fill { background: var(--red); }
.op-block1.status-gray   .op-anchor-gauge-fill { background: #a0aab8; }

.op-anchor-gauge-mark {
  position: absolute;
  top: -4px;
  bottom: -4px;
  width: 2px;
  background: var(--navy);
  border-radius: 1px;
}

.op-anchor-meta {
  font-size: 11px;
  font-weight: 800;
  color: var(--text-gray-dark);
  margin-top: 8px;
  letter-spacing: 0.3px;
}

.op-anchor-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #f4f6fa;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 10px;
  font-weight: 800;
  color: var(--text-gray-dark);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-top: 12px;
}

/* Lado direito — cartões Mês / YTD */
.op-meta-cards {
  padding: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: stretch;
}
.op-meta-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: center;
}
.op-meta-card-title {
  font-size: 9px;
  font-weight: 800;
  color: var(--text-gray);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 2px;
}
.op-meta-card-main {
  font-size: 26px;
  font-weight: 900;
  color: var(--navy);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}
.op-meta-card-sub {
  font-size: 9px;
  font-weight: 700;
  color: var(--text-gray);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.op-meta-card-delta {
  font-size: 12px;
  font-weight: 800;
  margin-top: 4px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
  font-variant-numeric: tabular-nums;
}
.op-meta-card-delta.up   { color: var(--green); }
.op-meta-card-delta.down { color: var(--red); }
.op-meta-card-delta.flat { color: var(--text-gray-dark); }

/* ─── BLOCO 2 — COMO EVOLUÍMOS ──────────────────────────── */
.op-yoy-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.op-yoy-table thead th {
  background: #f8fafc;
  color: var(--text-gray);
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 8px 14px;
  text-align: right;
  border-bottom: 1px solid var(--border);
}
.op-yoy-table thead th.metric { text-align: left; }
.op-yoy-table tbody td {
  padding: 10px 14px;
  text-align: right;
  font-weight: 800;
  color: var(--navy);
  border-bottom: 1px solid #f1f4f9;
  font-variant-numeric: tabular-nums;
}
.op-yoy-table tbody td.metric {
  text-align: left;
  font-weight: 700;
  color: var(--text-gray-dark);
  font-size: 11px;
}
.op-yoy-table tbody tr:last-child td { border-bottom: none; }
.op-yoy-table tbody tr:nth-child(even) td { background: #fafbfd; }

.op-yoy-table td.delta.up   { color: var(--green); }
.op-yoy-table td.delta.down { color: var(--red); }
.op-yoy-table td.delta.flat { color: var(--text-gray-dark); }

/* ─── BLOCO 3 — COMPOSIÇÃO ───────────────────────────────── */
.op-comp-row {
  display: grid;
  grid-template-columns: 70px 1fr 90px;
  gap: 12px;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid #f1f4f9;
}
.op-comp-row:last-of-type { border-bottom: none; }
.op-comp-label {
  font-size: 10px;
  font-weight: 800;
  color: var(--text-gray-dark);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.op-comp-bar {
  height: 12px;
  background: #eef1f6;
  border-radius: 3px;
  overflow: hidden;
}
.op-comp-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
}
.op-comp-bar-fill.dentro { background: linear-gradient(90deg, var(--green), #66bb6a); }
.op-comp-bar-fill.fora   { background: linear-gradient(90deg, var(--red), #e57373); }
.op-comp-value {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.op-comp-total {
  display: grid;
  grid-template-columns: 70px 1fr 90px;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  background: #f8fafc;
  border-top: 2px solid var(--border);
}
.op-comp-total .op-comp-label { color: var(--navy); }
.op-comp-total .op-comp-value {
  font-size: 18px;
  color: var(--navy);
  font-weight: 900;
}

/* ─── RODAPÉ DE IDENTIFICAÇÃO ────────────────────────────── */
.op-modal-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: #fff;
  border-top: 1px solid var(--border);
  gap: 14px;
  flex-shrink: 0;
}
.op-footer-people {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
  min-width: 0;
}
.op-person {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.op-person-role {
  font-size: 8px;
  font-weight: 800;
  color: var(--text-gray);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.op-person-name {
  font-size: 11px;
  font-weight: 800;
  color: var(--navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.op-person-divider {
  width: 1px;
  height: 26px;
  background: var(--border);
  flex-shrink: 0;
}

/* ─── RESPONSIVO ─────────────────────────────────────────── */
@media (max-width: 700px) {
  .op-block1-grid { grid-template-columns: 1fr; }
  .op-anchor { border-right: none; border-bottom: 1px dashed var(--border); }
  .op-anchor-value { font-size: 42px; }
  .op-meta-cards { grid-template-columns: 1fr 1fr; padding: 12px; }
  .op-meta-card-main { font-size: 22px; }
  .op-yoy-table { font-size: 11px; }
  .op-yoy-table thead th, .op-yoy-table tbody td { padding: 8px 8px; }
  .op-comp-row, .op-comp-total {
    grid-template-columns: 60px 1fr 70px;
    gap: 8px;
    padding: 8px 12px;
  }
  .op-footer-people { gap: 10px; }
  .op-person-name { font-size: 10px; }
}

@media (max-width: 480px) {

  .op-yoy-table tbody tr { display: block; border-bottom: 1px solid var(--border); }
  .op-yoy-table tbody td::before {

    color: var(--text-gray);

}

  .ticker-bar {
    flex-shrink: 0;
    height: 24px;
    background: linear-gradient(90deg, var(--navy-deep) 0%, var(--navy) 60%, var(--navy-deep) 100%);
    color: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding-left: 92px;
    border-top: 2px solid var(--gold);
    position: relative;
  }
  .ticker-bar::before {
    content: "INDICADORES";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 92px;
    background: var(--red);
    color: #ffffff;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.6px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    text-transform: uppercase;
    border-right: 2px solid var(--gold);
    box-sizing: content-box;
  }
  .ticker-bar::after {
    content: "";
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 70px;
    background: linear-gradient(90deg, rgba(13,23,48,0) 0%, rgba(13,23,48,0.85) 60%, var(--navy-deep) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .ticker-track {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    animation: tickerScroll 120s linear infinite;
    will-change: transform;
  }
  .ticker-track:hover { animation-play-state: paused; }

  .ticker-item {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 500;
    color: #cdd6e5;
    padding: 0 14px;
    line-height: 1;
  }
  .ticker-item::before {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    margin-right: 8px;
    flex-shrink: 0;
  }
  .ticker-item b {
    color: #ffffff;
    font-weight: 800;
    margin-right: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-size: 9px;
  }
  .ticker-item::after {
    content: "";
    display: inline-block;
    width: 1px; height: 10px;
    background: rgba(255,255,255,0.18);
    margin-left: 14px;
    flex-shrink: 0;
  }

  @keyframes tickerScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

/* ============================================================
   GAUGE REDESENHADO — ESCALA FIXA + MARCADOR DE META
   ------------------------------------------------------------
   - Trilha representa a escala real (0%–100% ou 0–unidade_tempo)
   - Preenchimento colorido: verde se dentro da meta, vermelho se fora
   - Marcador vertical (traço) indica a posição da meta
   - Largura limitada para nunca invadir os cartões Mês/YTD ao lado
   ============================================================ */

.op-anchor-gauge-wrap {
  width: 100%;
  max-width: 280px;
  margin: 14px auto 0;
  box-sizing: border-box;
}

.op-anchor-gauge {
  position: relative;
  height: 12px;
  background: #e8ecf3;
  border-radius: 6px;
  overflow: hidden;
}

.op-anchor-gauge-fill {
  height: 100%;
  border-radius: 6px;
  transition: width 0.5s ease;
  background: #a0aab8;
}
.op-anchor-gauge-fill.within {
  background: linear-gradient(90deg, #81c784, #43a047);
}
.op-anchor-gauge-fill.outside {
  background: linear-gradient(90deg, #ef5350, #d6301f);
}
.op-anchor-gauge-fill.neutral {
  background: #a0aab8;
}

.op-anchor-gauge-mark {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--navy);
  border-radius: 1px;
  transform: translateX(-50%);
  box-shadow: 0 0 0 1.5px #fff;
  z-index: 2;
  pointer-events: none;
}

.op-anchor-gauge-scale {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  font-weight: 700;
  color: var(--text-gray);
  margin-top: 4px;
  letter-spacing: 0.3px;
  font-variant-numeric: tabular-nums;
  gap: 4px;
}
.op-anchor-gauge-scale .scale-meta {
  color: var(--navy);
  font-weight: 800;
  font-size: 9px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Mobile — reduz altura e mantém o marcador visível */
@media (max-width: 480px) {
  .op-anchor-gauge-wrap { max-width: 100%; }
  .op-anchor-gauge { height: 10px; }
  .op-anchor-gauge-scale { font-size: 8px; }
}

/* ============================================================
   REFINAMENTO ESTÉTICO DO MODAL
   ============================================================ */

/* Ajuste 1 — espaço para os botões ◀ ▶ não cobrirem a tabela */
.op-modal-body { padding: 18px 52px 22px; }
@media (max-width: 640px) {
  .op-modal-body { padding: 14px 42px 18px; }
}

/* Ajuste 2 — remover dupla barra vertical no Bloco 1 */
.op-block1 { border-left-width: 6px; }
.op-block1 > .op-block-label { border-left-color: transparent; }

/* Ajuste 3 — rótulo do bloco mais legível */
.op-block-label {
  gap: 10px;
  font-size: 10px;
  letter-spacing: 1.4px;
  padding: 8px 16px;
}

/* Ajuste 4 — marcador de meta centralizado no gauge */
.op-anchor-gauge-mark { transform: translateX(-50%); }

/* Ajuste 5 — filete de status nos cartões Mês / YTD */
.op-meta-card { position: relative; overflow: hidden; }
.op-meta-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: #cbd3de;
}
.op-block1.status-green  .op-meta-card::before { background: var(--green); }
.op-block1.status-yellow .op-meta-card::before { background: var(--yellow); }
.op-block1.status-red    .op-meta-card::before { background: var(--red); }
.op-block1.status-gray   .op-meta-card::before { background: #a0aab8; }

.op-block1.status-green  .op-meta-card-main { color: var(--green); }
.op-block1.status-yellow .op-meta-card-main { color: var(--gold-deep); }
.op-block1.status-red    .op-meta-card-main { color: var(--red); }
.op-block1.status-gray   .op-meta-card-main { color: var(--text-gray-dark); }

/* Ajuste 6 — pílula de status com fundo colorido */
.op-anchor-status {
  padding: 5px 14px;
  font-size: 11px;
  letter-spacing: 0.5px;
}
.op-block1.status-green  .op-anchor-status {
  background: #e8f5e9; border-color: #a5d6a7; color: #2e7031;
}
.op-block1.status-yellow .op-anchor-status {
  background: #fff7e0; border-color: #f0dba8; color: #9c7a3d;
}
.op-block1.status-red    .op-anchor-status {
  background: #ffebee; border-color: #ef9a9a; color: #b90302;
}

/* Ajuste 7 — coluna da composição com largura flexível */
.op-comp-row,
.op-comp-total {
  grid-template-columns: minmax(60px, 90px) 1fr minmax(90px, 140px);
}
.op-comp-value {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
@media (max-width: 480px) {
  .op-comp-row,
  .op-comp-total {
    grid-template-columns: minmax(50px, 70px) 1fr minmax(70px, 100px);
  }
}

/* Ajuste 8 — hierarquia na tabela YoY */
.op-yoy-table thead th {
  background: #eef1f6;
  color: var(--navy);
  font-weight: 800;
  padding: 10px 14px;
  border-bottom: 2px solid var(--border);
}
.op-yoy-table tbody td { padding: 12px 16px; }
.op-yoy-table tbody td.metric {
  background: #f8fafc;
  font-weight: 800;
  color: var(--navy);
  border-right: 1px solid var(--border);
}
.op-yoy-table tbody td.delta {
  background: #fafbfd;
  font-size: 13px;
}

/* Ajuste 9 — entrada escalonada dos blocos */
@keyframes blockFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.op-block { animation: blockFadeIn 0.35s ease both; }
.op-block:nth-of-type(1) { animation-delay: 0.05s; }
.op-block:nth-of-type(2) { animation-delay: 0.13s; }
.op-block:nth-of-type(3) { animation-delay: 0.21s; }

/* ============================================================
   VALOR MONETÁRIO COM TOOLTIP
   ------------------------------------------------------------
   Sublinhado pontilhado discreto indica que há valor completo
   ao passar o mouse. Tooltip é nativo (title attribute), então
   zero JavaScript adicional.
   ============================================================ */
.val-moeda {
  cursor: help;
  border-bottom: 1px dotted rgba(22, 35, 74, 0.35);
  padding-bottom: 1px;
}
.vol-budget-group.current .val-moeda {
  border-bottom-color: rgba(22, 35, 74, 0.5);

.v-data.single .val-moeda {
  border-bottom-width: 2px;
}

/* Células de "sem dados" na tabela YoY — quando um dos lados
   não tem valor de comparação, mas a tabela ainda mostra as colunas
   porque outras linhas têm. */
.op-yoy-table td.sem-dados {
  color: #cbd3de;
  font-weight: 500;
  font-style: italic;
}

/* ============================================================
   PIPELINE MULTICOUNTRY
   ============================================================ */
var VIEW = "BR+PY";
var DATA_RAW = JSON.parse(JSON.stringify(DATA));

function _isVisible(item) {
  if (!item || typeof item !== "object") return true;
  var p = item.pais;
  if (!p || p === "ambos") return true;
  if (VIEW === "BR+PY") return true;
  return p === VIEW;
}

function _paisBadge(item) {
  var p = item && item.pais;
  if (!p || p === "ambos") return "";
  return ' <span style="font-size:8px; font-weight:800; color:#fff; background:' +
         (p === 'BR' ? 'var(--navy)' : 'var(--gold-deep)') +
         '; padding:1px 5px; border-radius:3px; margin-left:6px; vertical-align:middle;">' +
         p + '</span>';
}

function _isTextoVisible(textoPais) {
  if (!textoPais || textoPais === "ambos") return true;
  if (VIEW === "BR+PY") return true;
  return textoPais === VIEW;
}

function _hasViewData(item) {
  if (!item || typeof item !== "object") return true;
  if (!item.valores) return true;
  if (VIEW === "BR+PY") return true;
  return item.valores[VIEW] !== undefined && item.valores[VIEW] !== null;
}

function _montarMarquee(track) {
  if (!track) return;
  var container = track.parentElement;
  if (!container) return;

  var text = track.textContent || "";
  if (!text.trim()) return;

  var SEP = "\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0";

  track.textContent = text + SEP;
  var oneW = track.scrollWidth;
  if (oneW <= 0) {
    requestAnimationFrame(function(){ _montarMarquee(track); });
    return;
  }

  var cw = container.clientWidth || 800;
  var copies = Math.max(2, Math.ceil((2 * cw) / oneW));

  while (track.firstChild) track.removeChild(track.firstChild);
  for (var i = 0; i < copies; i++) {
    track.appendChild(document.createTextNode(text + SEP));
  }

  track.style.setProperty("--marquee-shift", (-100 / copies) + "%");

  var pxPerSec = 55;
  var duration = Math.max(15, oneW / pxPerSec);
  track.style.animationDuration = duration + "s";
}

function _ativarMarquees() {
  var tracks = document.querySelectorAll(".banner-track, .op-texto-track");
  for (var i = 0; i < tracks.length; i++) {
    _montarMarquee(tracks[i]);
  }
}

function _resolveItem(item) {
  if (!item || typeof item !== "object") return item;
  if (!item.valores) return item;
  var v = item.valores[VIEW] || item.valores.BR || {};
  var out = {};
  Object.keys(item).forEach(function(k){ out[k] = item[k]; });
  Object.keys(v).forEach(function(k){ out[k] = v[k]; });
  return out;
}

function _filterVisible(arr) {
  return (arr || []).filter(_isVisible).map(_resolveItem);
}

function _applyView() {
  DATA = JSON.parse(JSON.stringify(DATA_RAW));

  DATA.volumetria  = _filterVisible(DATA.volumetria);
  DATA.estrategicos = _filterVisible(DATA.estrategicos);

  DATA.operacionais = _filterVisible(DATA.operacionais)
    .map(function(sec){
      sec.itens = _filterVisible(sec.itens);
      return sec;
    })
    .filter(function(sec){ return (sec.itens || []).length > 0; });

  if (DATA.taticos) {
    DATA.taticos.linhas = DATA.taticos.linhas
      .filter(_isVisible)
      .filter(_hasViewData)
      .map(function(row){
        var resolved = _resolveItem(row);
        var rawMetrics = (resolved.metrics || []);
        resolved.metrics = rawMetrics
          .filter(_isVisible)
          .filter(_hasViewData)
          .map(_resolveItem);
        return resolved;
      })
      .filter(function(row){ return (row.metrics || []).length > 0; });
  }

  if (DATA.exportacao) DATA.exportacao.kpis = _filterVisible(DATA.exportacao.kpis);
  if (DATA.sac)        DATA.sac.kpis        = _filterVisible(DATA.sac.kpis);
}

function switchView(v) {
  if (v === VIEW) return;
  // ⭐ Fecha o modal operacional antes de reconstruir OP_ITEMS_INDEX.
  // Sem isso, o modal aberto passa a exibir outro item após a troca.
  closeOpCardModal();
  VIEW = v;

function parseNumber(str) {
  if (typeof str === 'number') return isFinite(str) ? str : 0;
  if (str === null || str === undefined) return 0;
  var s = String(str).trim().replace(/[R$\s%]/g, '');
  if (s === '') return 0;

  var hasComma = s.indexOf(',') !== -1;
  var dots = (s.match(/\./g) || []).length;

  if (hasComma) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (dots > 1) {
    s = s.replace(/\./g, '');
  } else if (dots === 1) {
    var parts = s.split('.');
    if (parts[1] && parts[1].length === 3) {
      s = parts[0] + parts[1];
    }
  }

  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

/* ============================================================
   ABREVIAÇÃO MONETÁRIA — exibição apenas
   ------------------------------------------------------------
   - Só exibe abreviado a partir de mil (>= 1.000)
   - Usa 3 casas decimais com vírgula (padrão pt-BR)
   - Nunca modifica o valor original — só a apresentação
   - Tooltip (title) mostra o valor completo
   ============================================================ */

function _abreviaMoeda(valor, moeda) {
  if (valor === null || valor === undefined || valor === '') return '—';
  var num = parseNumber(valor);
  if (isNaN(num)) return '—';

  var prefix = (moeda === 'USD') ? 'US$ ' : 'R$ ';
  var abs = Math.abs(num);
  var suffix = '';
  var div = 1;

  if (abs >= 1e9)      { suffix = ' bi';  div = 1e9; }
  else if (abs >= 1e6) { suffix = ' mi';  div = 1e6; }
  else if (abs >= 1e3) { suffix = ' mil'; div = 1e3; }
  else {
    /* Números abaixo de mil → formato normal com 2 decimais */
    return prefix + num.toLocaleString('pt-BR', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  var abrev = num / div;
  var formatted = abrev.toLocaleString('pt-BR', {
    minimumFractionDigits: 3,
    maximumFractionDigits: 3
  });

  return prefix + formatted + suffix;
}

/* Versão com tooltip — retorna HTML com <span title="..."> */
function _abreviaMoedaComTooltip(valor, moeda) {
  if (valor === null || valor === undefined || valor === '') return '—';
  var num = parseNumber(valor);
  if (isNaN(num)) return '—';

  var prefix = (moeda === 'USD') ? 'US$ ' : 'R$ ';
  var full = prefix + num.toLocaleString('pt-BR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  var abbrev = _abreviaMoeda(valor, moeda);

  /* Se não abreviou, não precisa de tooltip */
  if (full === abbrev) return abbrev;

  return '<span class="val-moeda" title="' + full + '">' + abbrev + '</span>';
}

function formatNum(value, fmt, decimals) {
  if (value === null || value === undefined || value === '') return '—';

  if (!fmt || fmt === 'auto') {
    if (typeof value === 'string') return value;
    if (typeof value === 'number') {
      if (Number.isInteger(value)) return value.toLocaleString('pt-BR');
      return value.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
    }
    return String(value);
  }

  var num = parseNumber(value);
  if (isNaN(num)) return String(value);

  if (decimals === undefined || decimals === null || decimals === '') decimals = 2;
  decimals = parseInt(decimals);
  if (isNaN(decimals)) decimals = 2;
  decimals = Math.max(0, Math.min(6, decimals));

  function br(n, d) {
    return n.toLocaleString('pt-BR', {
      minimumFractionDigits: d, maximumFractionDigits: d
    });
  }

  switch (fmt) {
    case 'integer':       return Math.round(num).toLocaleString('pt-BR');
    case 'decimal':       return br(num, decimals);
    case 'percent':       return br(num, decimals) + '%';
    case 'percent_frac':  return br(num * 100, decimals) + '%';
    case 'currency_brl':  return _abreviaMoedaComTooltip(num, 'BRL');
    case 'currency_usd':  return _abreviaMoedaComTooltip(num, 'USD');
    case 'compact':
      var abs = Math.abs(num);
      if (abs >= 1e9) return (num / 1e9).toFixed(1).replace('.', ',') + 'B';
      if (abs >= 1e6) return (num / 1e6).toFixed(1).replace('.', ',') + 'M';
      if (abs >= 1e3) return (num / 1e3).toFixed(1).replace('.', ',') + 'K';
      return String(Math.round(num));
    case 'raw':           return String(num);
    default:              return String(value);
  }
}

function formatPercent(p){
  if (p === null || p === undefined || isNaN(p)) return '—';
  // ⭐ 1 casa decimal — mantém coerência entre o texto central do gauge,
  // o ponteiro do SVG e o cálculo de tier (_calcDotClass). Sem isso,
  // 99.6% exibia "100%" enquanto o ponteiro apontava para 99.6.
  return p.toFixed(1).replace('.', ',') + '%';
}

var gaugeGradCounter = 0;

function buildGaugeSVG(percentMes, percentYTD, isLower) {
  var cx = 100, cy = 92, r = 76, sw = 17, gradId = "gaugeGrad" + (gaugeGradCounter++);

  function angleFor(p) { return 180 - (Math.max(0, Math.min(150, p)) / 150) * 180; }
  function pointAt(p, radius) {
    var a = angleFor(p) * Math.PI / 180;
    return { x: cx + radius * Math.cos(a), y: cy - radius * Math.sin(a) };
  }

  var fullPath = "M " + pointAt(0, r).x.toFixed(2) + " " + pointAt(0, r).y.toFixed(2)
               + " A " + r + " " + r + " 0 0 1 "
               + pointAt(150, r).x.toFixed(2) + " " + pointAt(150, r).y.toFixed(2);
  var pMes = pointAt(Math.min(percentMes, 150), r);

  var gradDef;
  if (isLower) {
    gradDef = '<linearGradient id="' + gradId + '" x1="0%" y1="0%" x2="100%" y2="0%">' +
              '<stop offset="0%" stop-color="#99B81D" />' +
              '<stop offset="66.6%" stop-color="#FBDF00" />' +
              '<stop offset="93.3%" stop-color="#B90302" />' +
              '<stop offset="100%" stop-color="#B90302" /></linearGradient>';
  } else {
    gradDef = '<linearGradient id="' + gradId + '" x1="0%" y1="0%" x2="100%" y2="0%">' +
              '<stop offset="0%" stop-color="#B90302" />' +
              '<stop offset="66.6%" stop-color="#FBDF00" />' +
              '<stop offset="93.3%" stop-color="#99B81D" />' +
              '<stop offset="100%" stop-color="#99B81D" /></linearGradient>';
  }

  // ── YTD (linha tracejada) ──────────────────────────────
  var ytdLine = '';
  if (percentYTD !== null && !isNaN(percentYTD)) {
    var pYTD = pointAt(Math.min(percentYTD, 150), r);
    ytdLine = '<line x1="' + cx + '" y1="' + cy + '" x2="' + pYTD.x.toFixed(2) +
              '" y2="' + pYTD.y.toFixed(2) + '" stroke="#16234a" stroke-width="2" ' +
              'stroke-linecap="round" stroke-dasharray="2 2" />';
  }

  // ⭐ MARCADOR DE META — triângulo dourado apontando para 100% da escala.
  // Como pMes e pYTD já são "valor ÷ meta × 100", o ponto 100% do arco
  // É a meta. Antes ele existia só implicitamente; agora fica visível.
  var tipRadius = r + sw / 2 + 0.5;    // toca a borda externa do arco
  var baseRadius = r + sw / 2 + 6;      // ponta da base fora do arco
  var halfWidth  = 2.5;                 // ±2,5 unidades na escala % (~⅙ do arco)

  var triTip   = pointAt(100,               tipRadius);
  var triBaseA = pointAt(100 - halfWidth,   baseRadius);
  var triBaseB = pointAt(100 + halfWidth,   baseRadius);

  var metaMarker =
    '<polygon points="' +
      triTip.x.toFixed(2)   + ',' + triTip.y.toFixed(2)   + ' ' +
      triBaseA.x.toFixed(2) + ',' + triBaseA.y.toFixed(2) + ' ' +
      triBaseB.x.toFixed(2) + ',' + triBaseB.y.toFixed(2) +
    '" fill="var(--gold)" stroke="#0d1730" stroke-width="0.5" ' +
    'stroke-linejoin="round" />';

  return '<svg viewBox="0 0 200 108" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' + gradDef + '</defs>' +
    '<path d="' + fullPath + '" stroke="url(#' + gradId + ')" stroke-width="' + sw + '" fill="none"/>' +
    metaMarker +                                                                      // ⭐ NEW
    ytdLine +
    '<line x1="' + cx + '" y1="' + cy + '" x2="' + pMes.x.toFixed(2) + '" y2="' + pMes.y.toFixed(2) +
      '" stroke="#ff1744" stroke-width="2.5" stroke-linecap="round" />' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#16234a" />' +
  '</svg>';
}

function buildChartHtml(data, type, color, isPercent = true, sort = true, opts = {}) {
  data = (data || []).filter(function(s){
    if (!s || typeof s !== 'object') return false;
    var temLabel = s.label !== undefined && s.label !== null && String(s.label).trim() !== "";
    var temTotal = s.valorTotal !== undefined && s.valorTotal !== null && String(s.valorTotal).trim() !== "";
    var temAberto = s.valorAberto !== undefined && s.valorAberto !== null && String(s.valorAberto).trim() !== "";
    var temValor = s.valor !== undefined && s.valor !== null && String(s.valor).trim() !== "";
    return temLabel || temTotal || temAberto || temValor;
  });
  if (data.length === 0) return '';

  if (type === 'line') {
    // ⭐ Linha precisa de 2+ pontos — com 1 só, a divisão (w / (n-1))
    // vira divisão por zero e gera NaN nas coordenadas do SVG.
    if (data.length < 2) return '';
    var labels = data.map(function(d){ return d.label; });
    var values = data.map(function(d){ return d.valor; });
    var padX = 10, padY = 5, width = 360, height = 40;
    var w = width - (padX*2), h = height - (padY*2);
    var maxVal = Math.max.apply(null, values);
    var minVal = Math.min.apply(null, values);
    var range = maxVal - minVal;
    if(range === 0) range = 1;
    var topPadding = range * 0.1, bottomPadding = range * 0.1;
    var yScale = h / (range + topPadding + bottomPadding);
    var pts = "";
    for(var i=0; i<values.length; i++) {
      var x = padX + (w / (values.length - 1)) * i;
      var y = padY + topPadding + ((maxVal + topPadding) - values[i]) * yScale;
      pts += (i===0 ? "M" : " L") + x.toFixed(2) + " " + y.toFixed(2);
    }
    var circles = "";
    for(var i=0; i<values.length; i++) {
      var x = padX + (w / (values.length - 1)) * i;
      var y = padY + topPadding + ((maxVal + topPadding) - values[i]) * yScale;
      circles += '<circle cx="'+x.toFixed(2)+'" cy="'+y.toFixed(2)+'" r="2.5" fill="#fff" stroke="'+color+'" stroke-width="1.5" />';
    }
    var labelsHtml = "";
    for(var i=0; i<labels.length; i++) {
      var x = padX + (w / (labels.length - 1)) * i;
      labelsHtml += '<text x="'+x.toFixed(2)+'" y="'+(height - 1)+'" text-anchor="middle" font-size="5" fill="#a7afbd" font-weight="700">'+labels[i]+'</text>';
    }
    return '<div class="chart-line-svg-wrap"><svg viewBox="0 0 '+width+' '+height+'">' +
      '<rect x="'+padX+'" y="'+padY+'" width="'+w+'" height="'+h+'" fill="none" stroke="#eef1f6" stroke-width="0.5" />' +
      '<path d="'+pts+'" stroke="'+color+'" stroke-width="2" fill="none" />' +
      circles + labelsHtml + '</svg></div>';
  } else if (type === 'horizontal') {
    var html = '<div class="hz-bar-container">';
    var sorted = data.slice().sort(function(a, b){ return b.valor - a.valor; });
    for(var i=0; i<sorted.length; i++){
      var label = sorted[i].label || '';
      html += '<div class="hz-bar-row">' +
        '<span class="hz-bar-label" title="'+label+'">'+label+'</span>' +
        '<div class="hz-bar-track"><div class="hz-bar-fill" style="width:'+sorted[i].valor+'%; background-color:'+color+';"></div></div>' +
        '<span class="hz-bar-val" style="color:'+color+';">'+sorted[i].valor + (isPercent ? '%' : '')+'</span>' +
      '</div>';
    }
    html += '</div>';
    return html;

  // ⭐ NOVO — Colunas empilhadas: Total (base) + Em Aberto (topo) na MESMA barra.
  // A altura da barra representa o Total; a fatia vermelha no topo mostra
  // a proporção de Em Aberto. Espera séries com { label, valorTotal, valorAberto }.
  } else if (type === 'vertical-stacked') {
    var color2 = opts.color2 || 'var(--red)';
    var label1 = opts.label1 || 'Fechados';
    var label2 = opts.label2 || 'Em Aberto';

    // maior Total do conjunto — referência de escala
    var maxTotal = 0;
    for (var i = 0; i < data.length; i++) {
      var tv = parseNumber(data[i].valorTotal) || 0;
      if (tv > maxTotal) maxTotal = tv;
    }
    if (maxTotal === 0) maxTotal = 1;

    var legendHtml = '<div class="dual-legend">' +
      '<span class="dual-legend-item"><span class="dual-swatch" style="background:' + color + ';"></span>' + label1 + '</span>' +
      '<span class="dual-legend-item"><span class="dual-swatch" style="background:' + color2 + ';"></span>' + label2 + '</span>' +
    '</div>';

    var html = legendHtml + '<div class="bar-chart-container bar-chart-stacked">';
    var sorted = sort
      ? data.slice().sort(function(a,b){ return (parseNumber(b.valorTotal)||0) - (parseNumber(a.valorTotal)||0); })
      : data.slice();

    for (var i = 0; i < sorted.length; i++) {
      var d = sorted[i];
      var total  = parseNumber(d.valorTotal) || 0;
      var aberto = (d.valorAberto !== undefined ? parseNumber(d.valorAberto) : 0) || 0;

      // sanity: Em Aberto é subconjunto do Total
      if (aberto > total) aberto = total;
      if (aberto < 0)     aberto = 0;

      var hTotal   = (total / maxTotal) * 100;                 // altura da barra (% do track)
      var hAberto  = total > 0 ? (aberto / total) * 100 : 0;    // % dentro da barra
      var hFechado = 100 - hAberto;                             // resto

      var vTotal  = isPercent ? total  + '%' : total;
      var vAberto = isPercent ? aberto + '%' : aberto;
      var vFechado = total - aberto;

      html += '<div class="bar-col">' +
        '<span class="bar-dual-val">' + vTotal + '</span>' +
        '<div class="bar-track">' +
          '<div class="bar-stack" style="height:' + Math.max(hTotal, 2) + '%;">' +
            (hAberto > 0
              ? '<div class="bar-stack-seg" ' +
                  'style="height:' + hAberto + '%; background-color:' + color2 + ';" ' +
                  'title="' + label2 + ': ' + vAberto + '"></div>'
              : '') +
            '<div class="bar-stack-seg" ' +
                'style="height:' + hFechado + '%; background-color:' + color + ';" ' +
                'title="' + label1 + ': ' + vFechado + '"></div>' +
          '</div>' +
        '</div>' +
        '<span class="bar-label">' + d.label + '</span>' +
      '</div>';
    }
    html += '</div>';
    return html;

  } else if (type === 'vertical-dual') {
    var color2 = opts.color2 || 'var(--red)';
    var label1 = opts.label1 || 'Total';
    var label2 = opts.label2 || 'Em Aberto';

    var maxVal = 0;
    for (var i = 0; i < data.length; i++) {
      var t = data[i].valorTotal || 0;
      var a = (data[i].valorAberto !== undefined ? data[i].valorAberto : data[i].valor) || 0;
      if (t > maxVal) maxVal = t;
      if (a > maxVal) maxVal = a;
    }
    if (maxVal === 0) maxVal = 1;

    var legendHtml = '<div class="dual-legend">' +
      '<span class="dual-legend-item"><span class="dual-swatch" style="background:' + color + ';"></span>' + label1 + '</span>' +
      '<span class="dual-legend-item"><span class="dual-swatch" style="background:' + color2 + ';"></span>' + label2 + '</span>' +
    '</div>';

    var html = legendHtml + '<div class="bar-chart-container bar-chart-dual">';
    var sorted = sort ? data.slice().sort(function(a,b){ return (b.valorTotal||0) - (a.valorTotal||0); }) : data.slice();

    for (var i = 0; i < sorted.length; i++) {
      var d = sorted[i];
      var total  = d.valorTotal || 0;
      var aberto = (d.valorAberto !== undefined ? d.valorAberto : d.valor) || 0;
      var hTotal  = (total  / maxVal) * 100;
      var hAberto = (aberto / maxVal) * 100;
      var vTotal  = isPercent ? total  + '%' : total;
      var vAberto = isPercent ? aberto + '%' : aberto;

      html += '<div class="bar-col bar-col-dual">' +
        '<div class="bar-dual-pair">' +
          '<div class="bar-dual-item" title="' + label1 + ': ' + vTotal + '">' +
            '<span class="bar-dual-val">' + vTotal + '</span>' +
            '<div class="bar-track-dual">' +
              '<div class="bar-fill-dual" style="height:' + Math.max(hTotal, 2) + '%; background-color:' + color + ';"></div>' +
            '</div>' +
          '</div>' +
          '<div class="bar-dual-item" title="' + label2 + ': ' + vAberto + '">' +
            '<span class="bar-dual-val">' + vAberto + '</span>' +
            '<div class="bar-track-dual">' +
              '<div class="bar-fill-dual" style="height:' + Math.max(hAberto, 2) + '%; background-color:' + color2 + ';"></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<span class="bar-label">' + d.label + '</span>' +
      '</div>';
    }
    html += '</div>';
    return html;
  } else {
    var maxVal = Math.max.apply(null, data.map(function(d){ return d.valor; }));
    if(maxVal === 0) maxVal = 1;
    var html = '<div class="bar-chart-container">';
    var sorted = sort ? data.slice().sort(function(a, b){ return b.valor - a.valor; }) : data.slice();
    for(var i=0; i<sorted.length; i++){
      var label = sorted[i].label || '';
      var heightPercent = (sorted[i].valor / maxVal) * 50;
      var valText = sorted[i].valor + (isPercent ? '%' : '');
      html += '<div class="bar-col">' +
        '<div class="bar-track">' +
          '<div class="bar-fill" style="height:'+Math.max(heightPercent, 12)+'%; background-color:'+color+';">' +
             '<span class="bar-value-text">'+valText+'</span>' +
          '</div>' +
        '</div>' +
        '<span class="bar-label">'+label+'</span>' +
      '</div>';
    }
    html += '</div>';
    return html;
  }
}

function comparativoHtml(realizado, previsto, label) {
  if (!previsto || previsto === 0) return '';
  var diff = ((realizado - previsto) / previsto) * 100;

    semantica: 'economia',   // realizado vs previsto → sempre economia
    tolerancia: 0,
    limiarForte: 15
  });
}

/* ============================================================
   DESVIO — helpers internos (engine)
   ============================================================ */

/* Tabela de inferência semântica — ordem importa (primeiro match ganha) */
var _DESVIO_REGEX = [
  { re: /or[çc]ament|previst|budget|realizad/i,     sem: 'economia'    },
  { re: /custo|despesa|gasto/i,                     sem: 'reducao'     },
  { re: /tempo|prazo|lead|sla|atend/i,              sem: 'reducao'     },
  { re: /colaborador|fte|headcount|pessoas/i,       sem: 'neutro'      },
  { re: /transa[çc]|volume|ordem|chamado|fatura/i,  sem: 'crescimento' }
];

/* Normaliza qualquer entrada numérica — nunca lança, nunca retorna NaN */
function _desvioNumber(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;

  var s = String(v).trim();
  if (!s || s === '-' || s === '—' || /^n\/?a$/i.test(s)) return null;

  s = s.replace(/[%R$\s]/g, '');
  if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');

  var n = parseFloat(s);
  return isFinite(n) ? n : null;
}

/* Infere a semântica a partir de um label */
function _desvioInferirSemantica(label) {
  if (!label) return 'crescimento';
  var l = String(label).toLowerCase();
  for (var i = 0; i < _DESVIO_REGEX.length; i++) {
    if (_DESVIO_REGEX[i].re.test(l)) return _DESVIO_REGEX[i].sem;
  }
  return 'crescimento';
}

/* ============================================================
   desvioHtml — variação com lógica de cores contextual
   ------------------------------------------------------------
   @param {number|string} desvio   Variação em %
   @param {string}        label    Rótulo exibido à esquerda
   @param {Object|boolean} [opts]  Opções (ou booleano legado)

   Opções:
     semantica    'economia' | 'crescimento' | 'reducao'
                  | 'neutro'  | 'auto'                (default: 'auto')
     contexto     String usada para inferência (fallback: label)
     tolerancia   Zona morta em % → fica cinza.       (default: 0.5)
     limiarForte  A partir daqui: ▲▲ / ▼▼.            (default: 15)
     decimais     Casas decimais.                     (default: 1)
     sufixo       Sufixo do valor.                    (default: '%')
   ============================================================ */
function desvioHtml(desvio, label, opts) {

  /* --- 0) Retrocompatibilidade: aceita booleano como 3º argumento --- */
  if (opts === true)  opts = { semantica: 'economia'    };
  if (opts === false) opts = { semantica: 'crescimento' };
  if (!opts || typeof opts !== 'object') opts = {};

  /* --- 1) Normalização --- */
  var n = _desvioNumber(desvio);
  if (n === null) return '';                 // sem variação válida → nada renderiza

  var semantica   = String(opts.semantica || 'auto').toLowerCase();
  var contexto    = opts.contexto || label;
  var tolerancia  = _desvioNumber(opts.tolerancia);
  var limiarForte = _desvioNumber(opts.limiarForte);
  var decimais    = _desvioNumber(opts.decimais);
  var sufixo      = (typeof opts.sufixo === 'string') ? opts.sufixo : '%';

  if (tolerancia  === null) tolerancia  = 0.5;
  if (limiarForte === null) limiarForte = 15;
  if (decimais    === null) decimais    = 1;

  decimais    = Math.max(0, Math.min(4, Math.floor(decimais)));
  tolerancia  = Math.max(0, tolerancia);
  limiarForte = Math.max(tolerancia, limiarForte);

  /* --- 2) Inferência automática --- */
  if (semantica === 'auto') semantica = _desvioInferirSemantica(contexto);

  /* --- 3) Estados --- */
  var abs      = Math.abs(n);
  var ehZero   = (n === 0);
  var ehNeutro = (semantica === 'neutro') || (abs < tolerancia);

  /* --- 4) Julgamento semântico --- */
  var ehBom = null;
  if (semantica === 'economia' || semantica === 'reducao') ehBom = (n < 0);
  else if (semantica === 'crescimento')                    ehBom = (n > 0);
  /* 'neutro' → ehBom permanece null → cor cinza */

  /* --- 5) Cor --- */
  var cor;
  if (ehZero || ehNeutro || ehBom === null) cor = 'var(--text-gray-dark)';
  else if (ehBom)                            cor = 'var(--green)';
  else                                        cor = 'var(--red)';

  /* --- 6) Seta com intensidade proporcional --- */
  var seta;
  if (ehZero || abs < tolerancia) seta = '=';
  else if (abs >= limiarForte)     seta = (n > 0) ? '▲▲' : '▼▼';
  else                              seta = (n > 0) ? '▲'  : '▼';

  /* --- 7) Texto formatado --- */
  var sinal = (n > 0) ? '+' : (n < 0 ? '−' : '');
  var valor = abs.toFixed(decimais).replace('.', ',');
  var texto = ehZero ? ('0' + sufixo) : (seta + ' ' + sinal + valor + sufixo);

  /* --- 8) Tooltip acessível --- */
  var tooltip;
  if (ehZero)                          tooltip = label + ' — sem variação';
  else if (ehNeutro || ehBom === null) tooltip = label + ' — dentro da tolerância';
  else if (ehBom)                      tooltip = label + ' — variação favorável';
  else                                  tooltip = label + ' — variação desfavorável';

  /* --- 9) Saída --- */
  return '<div class="vol-desvio" title="' + tooltip + '">' +
           '<span>' + label + '</span>' +
           '<span style="color:' + cor + '; font-weight:800; white-space:nowrap;">' +
             texto +
           '</span>' +
         '</div>';
}

      return ESTRATEGICOS_CATEGORIAS[i].categoria;

function formatYoY(val) {
  if (val === undefined || val === null || isNaN(val)) {
    return { text: '—', cls: 'flat' };
  }
  var arrow = val > 0 ? '▲' : (val < 0 ? '▼' : '=');
  var sinal = val > 0 ? '+' : '';
  var cls = val > 0 ? 'up' : (val < 0 ? 'down' : 'flat');
  return { text: arrow + ' ' + sinal + val.toFixed(1).replace('.', ',') + '%', cls: cls };
}

/* =========================================================
   HELPERS DOS CARDS OPERACIONAIS
   ========================================================= */
var OP_ITEMS_INDEX = [];

function _val(v) {
  if (v === undefined || v === null || v === '') return null;
  return v;
}

function _fmtOpInt(v) {
  if (v === undefined || v === null || v === '') return '—';
  var n = parseNumber(v);
  if (isNaN(n)) return '—';
  return Math.round(n).toLocaleString('pt-BR');
}

function _fmtOpPct(v, dec) {
  if (v === undefined || v === null || v === '') return '—';
  var n = parseNumber(v);
  if (isNaN(n)) return '—';
  dec = (dec === undefined) ? 1 : dec;
  return n.toLocaleString('pt-BR', {
    minimumFractionDigits: dec, maximumFractionDigits: dec
  }) + '%';
}

function _fmtOpVar(v) {
  if (v === undefined || v === null || v === '') return { text: '—', cls: 'flat' };
  var n = parseNumber(v);
  if (isNaN(n)) return { text: '—', cls: 'flat' };
  var arrow = n > 0 ? '▲' : (n < 0 ? '▼' : '=');
  var sinal = n > 0 ? '+' : '';
  var cls = n > 0 ? 'up' : (n < 0 ? 'down' : 'flat');
  return {
    text: arrow + ' ' + sinal + n.toFixed(1).replace('.', ',') + '%',
    cls: cls
  };
}

function _fmtOpDirection(d) {
  if (d === 'lower')  return 'Menor é melhor';
  if (d === 'higher') return 'Maior é melhor';
  return '—';
}

function _calcPctMes(it) {
  if (_val(it.pctMes) !== null) return parseNumber(it.pctMes);
  var d = parseNumber(it.dentro);
  var f = parseNumber(it.fora);
  var hasDF = _val(it.dentro) !== null || _val(it.fora) !== null;
  if (hasDF && (d + f) > 0) return (d / (d + f)) * 100;
  if (typeof it.valor === 'string' && it.valor.indexOf('%') !== -1) {
    return parseNumber(it.valor);
  }
  return null;
}

function _calcVolMes(it) {
  if (_val(it.volMes) !== null) return parseNumber(it.volMes);
  var d = parseNumber(it.dentro);
  var f = parseNumber(it.fora);
  var hasDF = _val(it.dentro) !== null || _val(it.fora) !== null;
  if (hasDF) return d + f;
  return null;
}

/* =========================================================
   TEMPO MÉDIO — helpers
   ========================================================= */
function _parseTempoValue(raw, unidade) {
  if (raw === null || raw === undefined) return null;
  var s = String(raw).trim();
  if (s === '' || s === '-') return null;

  if (unidade === 'hhmm') {
    var m = s.match(/^(\d{1,3}):(\d{1,2})$/);
    if (m) {
      var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
      if (mi >= 0 && mi < 60) return h * 60 + mi;
    }
    var n = parseNumber(s);
    return isNaN(n) ? null : n;
  }
  var n2 = parseNumber(s);
  return isNaN(n2) ? null : n2;
}

function _calcTempoMedioStatus(it) {
  var unidade = it.unidade_tempo || 'dias';
  var meta  = _parseTempoValue(it.meta, unidade);
  var tempo = _parseTempoValue(it.tempoMes, unidade);
  if (meta === null || meta <= 0 || tempo === null) return 'gray';

  var isLower = (it.direction !== 'higher');
  var ratio = tempo / meta;

  if (isLower) {
    return (ratio <= 1.0) ? 'green' : 'red';
  }
  return (ratio >= 1.0) ? 'green' : 'red';
}

function _formatTempoValue(value, unidade, decimals) {
  if (value === null || value === undefined) return '—';
  if (unidade === 'hhmm') {
    var total = Math.round(value);
    var h = Math.floor(total / 60);
    var m = total % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  var d = (decimals === undefined) ? 1 : decimals;
  return value.toFixed(d).replace('.', ',');
}

function _tempoDiffText(tempo, meta, unidade) {
  if (tempo === null || meta === null) return '—';
  var diff = tempo - meta;
  var sinal = diff > 0 ? '+' : (diff < 0 ? '−' : '±');
  var abs = Math.abs(diff);
  var txt;
  if (unidade === 'hhmm') {
    var h = Math.floor(abs / 60);
    var m = Math.round(abs % 60);
    txt = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  } else {
    txt = abs.toFixed(1).replace('.', ',');
  }
  return sinal + txt;
}

function _calcDotClass(it, pctMes, hasMeta, metaNum) {
  if (pctMes === null || !hasMeta) return 'gray';
  var isLower = (it.direction === 'lower');
  if (isLower) {
    return (pctMes <= metaNum) ? 'green' : 'red';
  }
  return (pctMes >= metaNum) ? 'green' : 'red';
}

/* ⭐ Versão binária do _calcDotClass — para porcentagens.
   Remove a faixa amarela ("zona de atenção") e força "maior é melhor".
   Retorna apenas: green | red | gray. */
function _calcDotClassBinario(it, pctMes, hasMeta, metaNum) {
  if (pctMes === null || !hasMeta) return 'gray';
  return (pctMes >= metaNum) ? 'green' : 'red';
}

   RENDER DOS CARDS OPERACIONAIS
   ========================================================= */
function renderOperacionais() {
  OP_ITEMS_INDEX = [];
  var secoes = DATA.operacionais || [];
  var maxItens = 0;
  for (var i = 0; i < secoes.length; i++) {
    var n = (secoes[i].itens || []).length;
    if (n > maxItens) maxItens = n;
  }
  var maxCols = Math.ceil(maxItens / 2) || 1;

  var html = "";
  for (var i = 0; i < secoes.length; i++) {
    var col = secoes[i];
    var cardsHtml = "";
    var itensVisiveis = col.itens || [];

    for (var j = 0; j < itensVisiveis.length; j++) {
      var it = itensVisiveis[j];
      var itemIndex = OP_ITEMS_INDEX.length;
      OP_ITEMS_INDEX.push({ item: it, section: col });

      if (it.tipo_card === 'tempo_medio') {
        cardsHtml += _buildTempoMedioCard(it, itemIndex);
        continue;
      }

      if (it.tipo_card === 'simples') {
        cardsHtml += _buildSimplesCard(it, itemIndex);
        continue;
      }

      var pctMes   = _calcPctMes(it);
      var volTotal = _calcVolMes(it);
      var metaNum = parseNumber(it.meta);
      var hasMeta = it.meta &&
                    String(it.meta).trim() !== '' &&
                    String(it.meta).trim() !== '-' &&
                    !isNaN(metaNum) && metaNum > 0;

      var dotClass = _calcDotClass(it, pctMes, hasMeta, metaNum);

      var pctText = (pctMes !== null)
        ? (Math.round(pctMes * 10) / 10).toLocaleString('pt-BR',
            { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'
        : '—';

      var volText = (volTotal !== null && !isNaN(volTotal))
        ? Math.round(volTotal).toLocaleString('pt-BR')
        : '—';

      var metaText = hasMeta ? it.meta : 'N/A';
      var metaLineCls = hasMeta ? '' : ' no-meta';

      cardsHtml +=
        '<div class="op-card-item status-' + dotClass + '" ' +
             'onclick="openOpCardModal(' + itemIndex + ')" ' +
             'title="Clique para ver todos os detalhes">' +
          '<div class="op-card-label">' + it.label + '</div>' +
          '<div class="op-card-pct-big">' + pctText + '</div>' +
          '<div class="op-card-pct-cap">Indicador do Mês</div>' +
          '<div class="op-card-total-line">' +
            '<span>Volume</span>' +
            '<span class="v">' + volText + '</span>' +
          '</div>' +
          '<div class="op-card-meta-line' + metaLineCls + '">' +
            '<span>Meta</span>' +
            '<span class="v">' + metaText + '</span>' +
          '</div>' +
        '</div>';
    }

    var textoHtml = '';
    if (col.texto && String(col.texto).trim() !== '' && _isTextoVisible(col.texto_pais)) {
      textoHtml =
        '<div class="op-section-texto">' +
          '<span class="op-texto-track">' + col.texto + '</span>' +
        '</div>';
    }

    html += '<section class="op-row-section">' +
      '<div class="op-row-header">' + icon(col.icon) + col.titulo + _paisBadge(col) + '</div>' +
      textoHtml +
      '<div class="op-cards-wrapper" style="grid-template-columns: repeat(' + maxCols + ', 1fr);">' +
        cardsHtml +
      '</div>' +
    '</section>';
  }

  document.getElementById("page-2").innerHTML = html;
}

/* =========================================================
   CARD TEMPO MÉDIO (render)
   ========================================================= */
function _buildTempoMedioCard(it, itemIndex) {
  var unidade   = it.unidade_tempo || 'dias';
  var dotClass  = _calcTempoMedioStatus(it);
  var tempoV    = _parseTempoValue(it.tempoMes, unidade);
  var tempoTxt  = _formatTempoValue(tempoV, unidade, 1);

  var unitHtml = (unidade === 'dias')
    ? '<div class="op-card-tempo-unit">dias</div>'
    : '';

  var metaStr = (it.meta && String(it.meta).trim() !== '') ? it.meta : 'N/A';
  var metaCls = (metaStr === 'N/A') ? ' no-meta' : '';

  var volTotal = _calcVolMes(it);
  var volText  = (volTotal !== null && !isNaN(volTotal))
    ? Math.round(volTotal).toLocaleString('pt-BR') : '—';

  // ⭐ Ordem dos blocos: label → tempo → unidade → caption → volume → meta
  // Alinha visualmente com os cards indicadores (volume antes de meta).
  return '<div class="op-card-item op-card-tempo status-' + dotClass + '" ' +
              'onclick="openOpCardModal(' + itemIndex + ')" ' +
              'title="Clique para ver todos os detalhes">' +
           '<div class="op-card-label">' + it.label + '</div>' +
           '<div class="op-card-tempo-big">' + tempoTxt + '</div>' +
           unitHtml +
           '<div class="op-card-tempo-cap">Tempo Médio do Mês</div>' +
           '<div class="op-card-total-line">' +
             '<span>Volume</span>' +
             '<span class="v">' + volText + '</span>' +
           '</div>' +
           '<div class="op-card-meta-line' + metaCls + '">' +
             '<span>Meta</span>' +
             '<span class="v">' + metaStr + '</span>' +
           '</div>' +
         '</div>';
}

/* =========================================================
   CARD OPERACIONAL — VALOR SIMPLES
   ========================================================= */
/* =========================================================
   CARD OPERACIONAL — INDICADOR COMPOSTO
   ========================================================= */
/* =========================================================
   CARD OPERACIONAL — INDICADOR COMPOSTO
   ========================================================= */
function _buildSimplesCard(it, itemIndex) {
  var fmtPrincipal = it.format || 'decimal';
  var fmtExtra     = it.format_extra || 'percent';
  var dec = (it.decimals !== undefined && it.decimals !== null && it.decimals !== '')
    ? parseInt(it.decimals) : 1;
  if (isNaN(dec)) dec = 1;
  dec = Math.max(0, Math.min(4, dec));

  function _fmt(v, fmt, d) {
    if (v === null || v === undefined || v === '') return '';
    var s = String(v).trim();
    if (s === '' || s === '-' || s === '—') return '';
    var num = parseNumber(v);
    if (isNaN(num)) return s;
    var br = function (n, dd) {
      return n.toLocaleString('pt-BR', {
        minimumFractionDigits: dd, maximumFractionDigits: dd
      });
    };
    var f  = fmt || 'decimal';
    var dd = (d !== undefined) ? d : 1;
    switch (f) {
      case 'integer':      return Math.round(num).toLocaleString('pt-BR');
      case 'percent':      return br(num, dd) + '%';
      case 'percent_frac': return br(num * 100, dd) + '%';
      case 'currency_brl': return 'R$ ' + br(num, dd);
      case 'currency_usd': return 'US$ ' + br(num, dd);
      case 'compact':
        var abs = Math.abs(num);
        if (abs >= 1e9) return br(num / 1e9, 1) + 'B';
        if (abs >= 1e6) return br(num / 1e6, 1) + 'M';
        if (abs >= 1e3) return br(num / 1e3, 1) + 'K';
        return String(Math.round(num));
      case 'raw':          return String(num);
      default:             return br(num, dd);
    }
  }

  var valorHtml = _fmt(it.valor, fmtPrincipal, dec) || '—';
  var mesHtml   = _fmt(it.mes,   fmtPrincipal, dec);
  var ytdHtml   = _fmt(it.ytd,   fmtPrincipal, dec);

  /* ── Linha MÊS / YTD ── */
  var pairHtml = '';
  if (mesHtml || ytdHtml) {
    var pairCls = (mesHtml && ytdHtml) ? '' : ' single';
    pairHtml =
      '<div class="op-composto-duo' + pairCls + '">' +
        (mesHtml
          ? '<div class="col"><span class="l">Mês</span><span class="v">' +
              mesHtml + '</span></div>'
          : '') +
        (ytdHtml
          ? '<div class="col"><span class="l">YTD</span><span class="v">' +
              ytdHtml + '</span></div>'
          : '') +
      '</div>';
  }

  /* ── Indicador secundário em linha compacta ── */
  var extraTitulo = (it.label_extra || '').trim();
  var extraMes    = _fmt(it.valor_extra_mes, fmtExtra, dec);
  var extraYTD    = _fmt(it.valor_extra_ytd, fmtExtra, dec);
  var extraParts  = [];
  if (extraMes) extraParts.push('Mês ' + extraMes);
  if (extraYTD) extraParts.push('YTD ' + extraYTD);

  var extraHtml = '';
  if (extraTitulo || extraParts.length) {
    extraHtml =
      '<div class="op-composto-extra">' +
        '<span class="lbl">' + _escHtml(extraTitulo || 'Extra') + '</span>' +
        '<span></span>' +
        '<span class="vals">' + extraParts.join('  ·  ') + '</span>' +
      '</div>';
  }

  /* ── Volume — reaproveita .op-card-total-line ── */
  var volMes = _fmt(it.vol_mes, 'integer', 0);
  var volYTD = _fmt(it.vol_ytd, 'integer', 0);
  var volHtml = '';
  if (volMes && volYTD) {
    volHtml =
      '<div class="op-composto-duo">' +
        '<div class="col"><span class="l">Vol. Mês</span><span class="v">' + volMes + '</span></div>' +
        '<div class="col"><span class="l">Vol. YTD</span><span class="v">' + volYTD + '</span></div>' +
      '</div>';
  } else if (volMes || volYTD) {
    var volLbl = volMes ? 'Volume Mês' : 'Volume YTD';
    var volVal = volMes || volYTD;
    volHtml =
      '<div class="op-card-total-line">' +
        '<span>' + volLbl + '</span>' +
        '<span class="v">' + volVal + '</span>' +
      '</div>';
  }

  /* ── Gerente / Coordenador ── */
  var ger = (it.gerente || '').trim();
  var cdn = (it.coordenador || '').trim();
  var peopleHtml = '';
  if (ger || cdn) {
    var rows = '';
    if (ger) {
      rows += '<div class="op-composto-person">' +
        '<span class="op-composto-person-role">Ger.</span>' +
        '<span class="op-composto-person-name">' + _escHtml(ger) + '</span>' +
      '</div>';
    }
    if (cdn) {
      rows += '<div class="op-composto-person">' +
        '<span class="op-composto-person-role">Coord.</span>' +
        '<span class="op-composto-person-name">' + _escHtml(cdn) + '</span>' +
      '</div>';
    }
    peopleHtml = '<div class="op-composto-people">' + rows + '</div>';
  }

  /* ── Fonte ── */
  var fonteHtml = it.fonte
    ? '<div class="op-composto-fonte">Fonte: ' + _escHtml(it.fonte) + '</div>'
    : '';

  return '<div class="op-card-item op-card-composto status-gray" ' +
              'onclick="openOpCardModal(' + itemIndex + ')" ' +
              'title="Clique para ver detalhes">' +
           '<div class="op-card-label">' + _escHtml(it.label) + '</div>' +
           '<div class="op-composto-hero">' + valorHtml + '</div>' +
           '<div class="op-composto-hero-cap">Indicador</div>' +
           pairHtml +
           extraHtml +
           volHtml +
           peopleHtml +
           fonteHtml +
         '</div>';
}
