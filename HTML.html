/* ============================================================
   HELPERS — DELTA, FORMATOS E BLOCOS DO NOVO MODAL
   ============================================================ */

/* Delta em pp (indicadores) — para variação vs meta */
function _fmtDeltaPp(delta, isLower) {
  if (delta === null || delta === undefined || isNaN(delta)) {
    return { text: '—', cls: 'flat' };
  }
  var abs = Math.abs(delta);
  var sinal = delta > 0 ? '+' : (delta < 0 ? '−' : '±');
  var text = (abs < 0.05)
    ? '= 0,0pp'
    : sinal + abs.toFixed(1).replace('.', ',') + 'pp';
  var good = isLower ? delta < 0 : delta > 0;
  var cls = (abs < 0.05) ? 'flat' : (good ? 'up' : 'down');
  return { text: text, cls: cls };
}

/* Delta em % (volumes) ou pp (indicadores YoY) — para o Bloco 2 */
/* Delta em % ou pp — para o Bloco 2.
   isLower === true  → cair é verde (tempo médio)
   isLower === false → subir é verde (volume, transações)
   isLower undefined → neutro (cinza) */
function _fmtDeltaYoy(val, unit, isLower) {
  if (val === null || val === undefined || isNaN(val)) {
    return { text: '—', cls: 'flat' };
  }
  var abs = Math.abs(val);
  var arrow;
  if (abs < 0.5) arrow = '=';
  else if (abs >= 15) arrow = val > 0 ? '▲▲' : '▼▼';
  else arrow = val > 0 ? '▲' : '▼';

  var sinal = val > 0 ? '+' : (val < 0 ? '−' : '');
  var suffix = unit === 'pp' ? 'pp' : '%';
  var text = (abs < 0.05)
    ? ('0' + suffix)
    : (arrow + ' ' + sinal + abs.toFixed(1).replace('.', ',') + suffix);

  /* Sem semântica → cinza */
  if (isLower === undefined || isLower === null) {
    return { text: text, cls: 'flat' };
  }

  /* Com semântica → verde/vermelho */
  var isFavorable;
  if (isLower) {
    isFavorable = (val < 0);   /* menor é melhor */
  } else {
    isFavorable = (val > 0);   /* maior é melhor */
  }
  var cls = (abs < 0.05) ? 'flat' : (isFavorable ? 'up' : 'down');
  return { text: text, cls: cls };
}

function _fmtIndicadorPct(v) {
  if (v === null || v === undefined || v === '') return '—';
  var n = parseNumber(v);
  if (isNaN(n)) return '—';
  var isInteiro = Math.abs(n - Math.round(n)) < 0.05;
  if (isInteiro) {
    return Math.round(n).toLocaleString('pt-BR') + '%';
  }
  return (Math.round(n * 10) / 10).toLocaleString('pt-BR',
    { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
}

/* Formata volume aplicando o format do card.
   - format inválido / ausente → 'integer' (padrão)
   - currency_brl / currency_usd → abrevia e adiciona tooltip
   - demais → usa formatNum normal */
function _fmtVolumeFmt(v, format) {
  if (v === null || v === undefined || v === '') return '—';
  var n = parseNumber(v);
  if (isNaN(n)) return '—';

  var fmt = (format || 'integer').toLowerCase();

  if (fmt === 'currency_brl') return _abreviaMoedaComTooltip(n, 'BRL');
  if (fmt === 'currency_usd') return _abreviaMoedaComTooltip(n, 'USD');

  /* integer, decimal, compact → usa o formatNum normal */
  return formatNum(n, fmt, fmt === 'decimal' ? 2 : 0);
}

/* Formata volume inteiro */
function _fmtVolume(v) {
  if (v === null || v === undefined || v === '') return '—';
  var n = parseNumber(v);
  if (isNaN(n)) return '—';
  return Math.round(n).toLocaleString('pt-BR');
}

/* Escapa caracteres especiais em textos do card (nomes, rótulos) */
function _escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* Verifica se o valor é numérico "real" — não vazio, não null, não zero.
   Usado para decidir se há comparação com o ano anterior. */
function _hasNum(v) {
  if (v === null || v === undefined || v === '') return false;
  var n = parseNumber(v);
  return !isNaN(n) && n !== 0;
}

/* Retorna número ou null — evita transformar "" em 0 */
function _yoyOrNull(raw) {
  if (raw === undefined || raw === null || raw === '') return null;
  var n = parseNumber(raw);
  return isNaN(n) ? null : n;
}

function _buildBlock1Html(it, pctMes, pctYTD, metaNum, hasMeta, dotClass) {
  var metaText = hasMeta ? it.meta : 'N/A';
  var isLower = (it.direction === 'lower');
  var pctDisplay = _fmtIndicadorPct(pctMes);

  /* ── Escala fixa 0–100% para indicadores percentuais ── */
  var SCALE_MAX = 100;

  var hasResult = (pctMes !== null && pctMes > 0);

  /* Posições na trilha (0–100 do container) */
  var resultPos = hasResult
    ? Math.min(Math.max(pctMes, 0), SCALE_MAX)
    : 0;

  var metaPos = hasMeta
    ? Math.min(Math.max(metaNum, 0), SCALE_MAX)
    : 0;

  /* Marcador não pode encostar nas extremidades (evita corte) */
  if (hasMeta) {
    metaPos = Math.max(1, Math.min(99, metaPos));
  }

  /* ── Cor do preenchimento — regra do indicador ──
     direction "higher": verde se pctMes >= meta
     direction "lower" : verde se pctMes <= meta
     Sem meta ou sem resultado → neutro (cinza). */
  var fillClass = 'neutral';
  if (hasResult && hasMeta) {
    var isWithin = isLower ? (pctMes <= metaNum) : (pctMes >= metaNum);
    fillClass = isWithin ? 'within' : 'outside';
  }

  /* Deltas vs meta (para os cartões Mês / YTD) */
  var deltaMes = (pctMes !== null && metaNum > 0) ? (pctMes - metaNum) : null;
  var deltaYTD = (pctYTD !== null && metaNum > 0) ? (pctYTD - metaNum) : null;
  var dMesF = _fmtDeltaPp(deltaMes, isLower);
  var dYTDF = _fmtDeltaPp(deltaYTD, isLower);

  var statusIcon = { green:'🟢', yellow:'🟡', red:'🔴', gray:'⚪' }[dotClass] || '⚪';
  var statusText = {
    green:'Meta atingida', yellow:'Atenção',
    red:'Fora da meta',    gray:'Sem meta'
  }[dotClass] || '—';

  function _card(label, val, deltaF) {
    var deltaHtml = (deltaF.text === '—')
      ? ''
      : '<div class="op-meta-card-delta ' + deltaF.cls + '">' + deltaF.text + '</div>';
    return '<div class="op-meta-card">' +
      '<div class="op-meta-card-title">' + label + '</div>' +
      '<div class="op-meta-card-main">' + _fmtIndicadorPct(val) + '</div>' +
      '<div class="op-meta-card-sub">Meta ' + _escHtml(metaText) + '</div>' +
      deltaHtml +
    '</div>';
  }

  /* ── Gauge ─────────────────────────────────────────────── */
  var gaugeHtml;
  if (hasMeta || hasResult) {
    var markerHtml = hasMeta
      ? '<div class="op-anchor-gauge-mark" ' +
        'style="left:' + metaPos.toFixed(2) + '%;"></div>'
      : '';
    var metaLabel = hasMeta ? 'Meta ' + _escHtml(metaText) : '';
    gaugeHtml =
      '<div class="op-anchor-gauge-wrap">' +
        '<div class="op-anchor-gauge">' +
          '<div class="op-anchor-gauge-fill ' + fillClass + '" ' +
               'style="width:' + resultPos.toFixed(2) + '%;"></div>' +
          markerHtml +
        '</div>' +
        '<div class="op-anchor-gauge-scale">' +
          '<span>0%</span>' +
          '<span class="scale-meta">' + metaLabel + '</span>' +
          '<span>100%</span>' +
        '</div>' +
      '</div>';
  } else {
    gaugeHtml = '<div class="op-anchor-meta" ' +
      'style="font-style:italic; color:var(--text-gray); margin-top:14px;">' +
      'Sem dados para exibir</div>';
  }

  return '<div class="op-block op-block1 status-' + dotClass + '">' +
    '<div class="op-block-label">📍 Onde estamos</div>' +
    '<div class="op-block1-grid">' +
      '<div class="op-anchor">' +
        '<div class="op-anchor-value">' + pctDisplay + '</div>' +
        '<div class="op-anchor-caption">Indicador Mês</div>' +
        gaugeHtml +
        '<div class="op-anchor-status">' + statusIcon + ' ' + statusText + '</div>' +
      '</div>' +
      '<div class="op-meta-cards">' +
        _card('Mês', pctMes, dMesF) +
        _card('YTD', pctYTD, dYTDF) +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ─── BLOCO 2 — COMO EVOLUÍMOS (indicador) ───────────────── */
function _buildBlock2Html(it, pctMes, pctYTD) {
  var rows = [];
  var fmt  = it.format || 'integer';

  /* Cada row tem: metric, cur, prev (null se sem comparação), delta (null idem) */

  /* Volume Mês */
  var temPrevVolMes = _hasNum(it.volMesAnt);
  if (_val(it.volMes) !== null || temPrevVolMes) {
    rows.push({
      metric: 'Volume Mês',
      cur:  _fmtVolumeFmt(it.volMes, fmt),
      prev: temPrevVolMes ? _fmtVolumeFmt(it.volMesAnt, fmt) : null,
      delta: temPrevVolMes ? _fmtDeltaYoy(_yoyOrNull(it.varYoyVolMes), 'pct') : null
    });
  }
  /* Volume YTD */
  var temPrevVolYTD = _hasNum(it.volYTDAnt);
  if (_val(it.volYTD) !== null || temPrevVolYTD) {
    rows.push({
      metric: 'Volume YTD',
      cur:  _fmtVolumeFmt(it.volYTD, fmt),
      prev: temPrevVolYTD ? _fmtVolumeFmt(it.volYTDAnt, fmt) : null,
      delta: temPrevVolYTD ? _fmtDeltaYoy(_yoyOrNull(it.varYoyVolYTD), 'pct') : null
    });
  }
  /* Indicador Mês */
  var temPrevPctMes = _hasNum(it.pctMesAnt);
  if (pctMes !== null || temPrevPctMes) {
    rows.push({
      metric: 'Indicador Mês',
      cur:  _fmtIndicadorPct(pctMes),
      prev: temPrevPctMes ? _fmtIndicadorPct(it.pctMesAnt) : null,
      delta: temPrevPctMes ? _fmtDeltaYoy(_yoyOrNull(it.varYoyPctMes), 'pp', false) : null
    });
  }
  /* Indicador YTD */
  var temPrevPctYTD = _hasNum(it.pctYTDAnt);
  if (pctYTD !== null || temPrevPctYTD) {
    rows.push({
      metric: 'Indicador YTD',
      cur:  _fmtIndicadorPct(pctYTD),
      prev: temPrevPctYTD ? _fmtIndicadorPct(it.pctYTDAnt) : null,
      delta: temPrevPctYTD ? _fmtDeltaYoy(_yoyOrNull(it.varYoyPctYTD), 'pp', false) : null
    });
  }

  if (!rows.length) return '';

  /* ⭐ Se NENHUMA linha tem comparação, ocultamos as colunas 2025 e Δ YoY */
  var temAlgumaComparacao = rows.some(function(r){ return r.prev !== null; });

  /* Header dinâmico */
  var headHtml = '<th class="metric">Métrica</th><th>2026</th>';
  if (temAlgumaComparacao) {
    headHtml += '<th>2025</th><th>Δ YoY</th>';
  }

  var body = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    body += '<tr>' +
      '<td class="metric" data-label="Métrica">' + _escHtml(r.metric) + '</td>' +
      '<td data-label="2026">' + r.cur + '</td>';

    if (temAlgumaComparacao) {
      if (r.prev !== null) {
        body += '<td data-label="2025">' + r.prev + '</td>' +
                '<td class="delta ' + r.delta.cls + '" data-label="Δ YoY">' +
                  r.delta.text + '</td>';
      } else {
        body += '<td data-label="2025" class="sem-dados">—</td>' +
                '<td data-label="Δ YoY" class="sem-dados">—</td>';
      }
    }

    body += '</tr>';
  }

  return '<div class="op-block op-block2">' +
    '<div class="op-block-label">📈 Como evoluímos</div>' +
    '<table class="op-yoy-table">' +
      '<thead><tr>' + headHtml + '</tr></thead>' +
      '<tbody>' + body + '</tbody>' +
    '</table>' +
  '</div>';
}

/* ─── BLOCO 3 — COMPOSIÇÃO ───────────────────────────────── */
function _buildBlock3Html(it, labelDentro, labelFora) {
  var dentro = parseNumber(it.dentro);
  var fora = parseNumber(it.fora);
  if (isNaN(dentro)) dentro = 0;
  if (isNaN(fora)) fora = 0;
  var total = dentro + fora;
  if (total <= 0) return '';

  var pctD = (dentro / total) * 100;
  var pctF = (fora / total) * 100;
  var fmt  = it.format || 'integer';

  return '<div class="op-block op-block3">' +
    '<div class="op-block-label">🥧 Composição do Mês</div>' +
    '<div class="op-comp-row">' +
      '<span class="op-comp-label">' + (labelDentro || 'Dentro') + '</span>' +
      '<div class="op-comp-bar">' +
        '<div class="op-comp-bar-fill dentro" style="width:' + pctD + '%;"></div>' +
      '</div>' +
      '<span class="op-comp-value">' + _fmtVolumeFmt(dentro, fmt) + '</span>' +
    '</div>' +
    '<div class="op-comp-row">' +
      '<span class="op-comp-label">' + (labelFora || 'Fora') + '</span>' +
      '<div class="op-comp-bar">' +
        '<div class="op-comp-bar-fill fora" style="width:' + pctF + '%;"></div>' +
      '</div>' +
      '<span class="op-comp-value">' + _fmtVolumeFmt(fora, fmt) + '</span>' +
    '</div>' +
    '<div class="op-comp-total">' +
      '<span class="op-comp-label">Total</span>' +
      '<span></span>' +
      '<span class="op-comp-value">' + _fmtVolumeFmt(total, fmt) + '</span>' +
    '</div>' +
  '</div>';
}

/* ─── RODAPÉ DE PESSOAS ──────────────────────────────────── */
function _buildPeopleHtml(it) {
  var g = it.gerente || '';
  var c = it.coordenador || '';
  if (!g && !c) return '';

  var html = '<div class="op-footer-people">';
  if (g) {
    html += '<div class="op-person">' +
      '<div class="op-person-role">Gerente</div>' +
      '<div class="op-person-name">' + _escHtml(g) + '</div>' +
    '</div>';
  }
  if (g && c) html += '<div class="op-person-divider"></div>';
  if (c) {
    html += '<div class="op-person">' +
      '<div class="op-person-role">Coordenador</div>' +
      '<div class="op-person-name">' + _escHtml(c) + '</div>' +
    '</div>';
  }
  html += '</div>';
  return html;
}

/* ============================================================
   MODAL — INDICADOR PADRÃO
   ============================================================ */
function _buildOpCardModalData(idx) {
  var entry = OP_ITEMS_INDEX[idx];
  if (!entry) return null;

  if (entry.item && entry.item.tipo_card === 'tempo_medio') {
    return _buildTempoMedioModalData(idx);
  }

  // ⭐ NOVO — card de valor simples
  if (entry.item && entry.item.tipo_card === 'simples') {
    return _buildSimplesModalData(idx);
  }

  var it  = entry.item;
  var sec = entry.section;

  var pctMes = _calcPctMes(it);
  var pctYTD = (function(){
    if (it.pctYTD !== undefined && it.pctYTD !== null && it.pctYTD !== '')
      return parseNumber(it.pctYTD);
    return null;
  })();

  var metaNum = parseNumber(it.meta);
  var hasMeta = it.meta && String(it.meta).trim() !== '' &&
                String(it.meta).trim() !== '-' &&
                !isNaN(metaNum) && metaNum > 0;

  /* ⭐ Porcentagens: sempre "maior é melhor".
     Criamos uma cópia com direction='higher' para que toda a
     cadeia (dotClass, gauge, pílula de status, deltas vs meta)
     use a regra binária verde/vermelho, independente do JSON. */
  var itHigher = Object.assign({}, it, { direction: 'higher' });
  var dotClass = _calcDotClassBinario(itHigher, pctMes, hasMeta, metaNum);

  /* Sub no header */
  var subParts = [];
  if (sec && sec.titulo) subParts.push(sec.titulo);
  if (it.pais && it.pais !== 'ambos') subParts.push('País: ' + it.pais);
  var subHtml = subParts.length
    ? '<span class="sub">' + subParts.join('  •  ') + '</span>' : '';

  return {
    it:        it,
    subHtml:   subHtml,
    block1:    _buildBlock1Html(itHigher, pctMes, pctYTD, metaNum, hasMeta, dotClass),
    block2:    _buildBlock2Html(itHigher, pctMes, pctYTD),
    block3:    _buildBlock3Html(it, 'Dentro', 'Fora'),
    footer:    _buildPeopleHtml(it),
  };
}

/* ============================================================
   MODAL — TEMPO MÉDIO
   ============================================================ */
function _buildTempoMedioModalData(idx) {
  var entry = OP_ITEMS_INDEX[idx];
  if (!entry) return null;
  var it  = entry.item;
  var sec = entry.section;

  var unidade = it.unidade_tempo || 'dias';
  var dotClass = _calcTempoMedioStatus(it);

  var tempoV    = _parseTempoValue(it.tempoMes, unidade);
  var tempoYtdV = _parseTempoValue(it.tempoYTD, unidade);
  var metaV     = _parseTempoValue(it.meta, unidade);
  var hasMeta   = (metaV !== null && metaV > 0);
  var isLower   = (it.direction !== 'higher');

  var tempoDisplay    = _formatTempoValue(tempoV,    unidade, 1);
  var tempoYtdDisplay = _formatTempoValue(tempoYtdV, unidade, 1);
  var metaDisplay     = hasMeta ? _formatTempoValue(metaV, unidade, 1) : 'N/A';

  /* ── Escala dinâmica — baseada em tempo (minutos ou dias) ──
     Margem de 15% acima do maior valor para dar respiro visual. */
  var scaleMax = 0;
  if (metaV  !== null && metaV  > 0) scaleMax = Math.max(scaleMax, metaV);
  if (tempoV !== null && tempoV > 0) scaleMax = Math.max(scaleMax, tempoV);
  scaleMax = scaleMax > 0 ? scaleMax * 1.15 : 1;

  var hasResult = (tempoV !== null && tempoV > 0);

  var resultPos = hasResult
    ? Math.min((tempoV / scaleMax) * 100, 100)
    : 0;

  var metaPos = hasMeta
    ? Math.min((metaV / scaleMax) * 100, 100)
    : 0;

  if (hasMeta) {
    metaPos = Math.max(1, Math.min(99, metaPos));
  }

  /* ── Cor do preenchimento — regra de tempo ──
     direction "lower" (mais comum): verde se tempo <= meta
     direction "higher": verde se tempo >= meta */
  var fillClass = 'neutral';
  if (hasResult && hasMeta) {
    var isWithin = isLower ? (tempoV <= metaV) : (tempoV >= metaV);
    fillClass = isWithin ? 'within' : 'outside';
  }

  /* ── Labels da escala (no formato da unidade) ── */
  var scaleMinLabel = (unidade === 'hhmm') ? '00:00' : '0';
  var scaleMaxLabel = _formatTempoValue(scaleMax, unidade, 1);
  if (unidade === 'hhmm') {
    /* hhmm sem decimais na escala */
    var totalMin = Math.round(scaleMax);
    var hh = Math.floor(totalMin / 60);
    var mm = totalMin % 60;
    scaleMaxLabel = (hh < 10 ? '0' : '') + hh + ':' +
                    (mm < 10 ? '0' : '') + mm;
  }

  /* Deltas vs meta (para os cartões Mês / YTD) */
  var deltaMesTxt = hasMeta ? _tempoDiffText(tempoV, metaV, unidade) : '—';
  var deltaYtdTxt = hasMeta ? _tempoDiffText(tempoYtdV, metaV, unidade) : '—';
  var deltaMesCls = 'flat', deltaYtdCls = 'flat';
  if (hasMeta && tempoV !== null) {
    var d1 = tempoV - metaV;
    deltaMesCls = (d1 === 0) ? 'flat'
      : ((isLower ? d1 < 0 : d1 > 0) ? 'up' : 'down');
  }
  if (hasMeta && tempoYtdV !== null) {
    var d2 = tempoYtdV - metaV;
    deltaYtdCls = (d2 === 0) ? 'flat'
      : ((isLower ? d2 < 0 : d2 > 0) ? 'up' : 'down');
  }

  var statusIcon = { green:'🟢', yellow:'🟡', red:'🔴', gray:'⚪' }[dotClass] || '⚪';
  var statusText = {
    green:'Dentro da meta', yellow:'Atenção',
    red:'Acima da meta',    gray:'Sem meta'
  }[dotClass] || '—';
  var directionHint = isLower ? '  •  menor é melhor' : '  •  maior é melhor';

  var unitSuffix = (unidade === 'dias')
    ? '<span class="op-anchor-unit">dias</span>' : '';

  /* ── Sub no header ── */
  var subParts = [];
  if (sec && sec.titulo) subParts.push(sec.titulo);
  if (it.pais && it.pais !== 'ambos') subParts.push('País: ' + it.pais);
  var subHtml = subParts.length
    ? '<span class="sub">' + subParts.join('  •  ') + '</span>' : '';

  /* ── Gauge ── */
  var gaugeHtml;
  if (hasMeta || hasResult) {
    var markerHtml = hasMeta
      ? '<div class="op-anchor-gauge-mark" ' +
        'style="left:' + metaPos.toFixed(2) + '%;"></div>'
      : '';
    var metaLabel = hasMeta ? 'Meta ' + metaDisplay : '';
    gaugeHtml =
      '<div class="op-anchor-gauge-wrap">' +
        '<div class="op-anchor-gauge">' +
          '<div class="op-anchor-gauge-fill ' + fillClass + '" ' +
               'style="width:' + resultPos.toFixed(2) + '%;"></div>' +
          markerHtml +
        '</div>' +
        '<div class="op-anchor-gauge-scale">' +
          '<span>' + scaleMinLabel + '</span>' +
          '<span class="scale-meta">' + metaLabel + '</span>' +
          '<span>' + scaleMaxLabel + '</span>' +
        '</div>' +
      '</div>';
  } else {
    gaugeHtml = '<div class="op-anchor-meta" ' +
      'style="font-style:italic; color:var(--text-gray); margin-top:14px;">' +
      'Sem dados para exibir</div>';
  }

  /* ── Bloco 1 ── */
  var block1 =
    '<div class="op-block op-block1 status-' + dotClass + '">' +
      '<div class="op-block-label">📍 Onde estamos</div>' +
      '<div class="op-block1-grid">' +
        '<div class="op-anchor">' +
          '<div class="op-anchor-value">' + tempoDisplay + unitSuffix + '</div>' +
          '<div class="op-anchor-caption">Tempo Médio Mês</div>' +
          gaugeHtml +
          '<div class="op-anchor-status">' + statusIcon + ' ' +
            statusText + directionHint + '</div>' +
        '</div>' +
        '<div class="op-meta-cards">' +
          '<div class="op-meta-card">' +
            '<div class="op-meta-card-title">Mês</div>' +
            '<div class="op-meta-card-main">' + tempoDisplay + '</div>' +
            '<div class="op-meta-card-sub">Meta ' + metaDisplay + '</div>' +
            '<div class="op-meta-card-delta ' + deltaMesCls + '">' +
              deltaMesTxt + '</div>' +
          '</div>' +
          '<div class="op-meta-card">' +
            '<div class="op-meta-card-title">YTD</div>' +
            '<div class="op-meta-card-main">' + tempoYtdDisplay + '</div>' +
            '<div class="op-meta-card-sub">Meta ' + metaDisplay + '</div>' +
            '<div class="op-meta-card-delta ' + deltaYtdCls + '">' +
              deltaYtdTxt + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  /* ── Bloco 2 — YoY (mantido como estava) ── */
  var rows = [];
  var tempoMesAntV = _parseTempoValue(it.tempoMesAnt, unidade);
  var tempoYtdAntV = _parseTempoValue(it.tempoYTDAnt, unidade);

  /* Tempo Médio Mês — usa parser de tempo (HH:MM ou dias) */
  var temPrevTempoMes = (tempoMesAntV !== null && tempoMesAntV > 0);
  if (tempoV !== null || temPrevTempoMes) {
    rows.push({
      metric: 'Tempo Médio Mês',
      cur:  tempoDisplay,
      prev: temPrevTempoMes ? _formatTempoValue(tempoMesAntV, unidade, 1) : null,
      delta: temPrevTempoMes
        ? _fmtDeltaYoy(_yoyOrNull(it.varYoyTempoMes), 'pct', isLower)
        : null
    });
  }
  /* Tempo Médio YTD — mesma lógica */
  var temPrevTempoYTD = (tempoYtdAntV !== null && tempoYtdAntV > 0);
  if (tempoYtdV !== null || temPrevTempoYTD) {
    rows.push({
      metric: 'Tempo Médio YTD',
      cur:  tempoYtdDisplay,
      prev: temPrevTempoYTD ? _formatTempoValue(tempoYtdAntV, unidade, 1) : null,
      delta: temPrevTempoYTD
        ? _fmtDeltaYoy(_yoyOrNull(it.varYoyTempoYTD), 'pct', isLower)
        : null
    });
  }
  /* Volume Mês */
  var fmt = it.format || 'integer';
  var temPrevVolMes = _hasNum(it.volMesAnt);
  if (it.volMes !== undefined || temPrevVolMes) {
    rows.push({
      metric: 'Volume Mês',
      cur:  _fmtVolumeFmt(it.volMes, fmt),
      prev: temPrevVolMes ? _fmtVolumeFmt(it.volMesAnt, fmt) : null,
      delta: temPrevVolMes ? _fmtDeltaYoy(_yoyOrNull(it.varYoyVolMes), 'pct') : null
    });
  }
  /* Volume YTD */
  var temPrevVolYTD = _hasNum(it.volYTDAnt);
  if (it.volYTD !== undefined || temPrevVolYTD) {
    rows.push({
      metric: 'Volume YTD',
      cur:  _fmtVolumeFmt(it.volYTD, fmt),
      prev: temPrevVolYTD ? _fmtVolumeFmt(it.volYTDAnt, fmt) : null,
      delta: temPrevVolYTD ? _fmtDeltaYoy(_yoyOrNull(it.varYoyVolYTD), 'pct') : null
    });
  }

  var block2 = '';
  if (rows.length) {
    /* ⭐ Se NENHUMA linha tem comparação, oculta colunas 2025 e Δ YoY */
    var temAlgumaComparacao = rows.some(function(r){ return r.prev !== null; });

    var headHtml = '<th class="metric">Métrica</th><th>2026</th>';
    if (temAlgumaComparacao) {
      headHtml += '<th>2025</th><th>Δ YoY</th>';
    }

    var body = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      body += '<tr>' +
        '<td class="metric" data-label="Métrica">' + _escHtml(r.metric) + '</td>' +
        '<td data-label="2026">' + r.cur + '</td>';

      if (temAlgumaComparacao) {
        if (r.prev !== null) {
          body += '<td data-label="2025">' + r.prev + '</td>' +
                  '<td class="delta ' + r.delta.cls + '" data-label="Δ YoY">' +
                    r.delta.text + '</td>';
        } else {
          body += '<td data-label="2025" class="sem-dados">—</td>' +
                  '<td data-label="Δ YoY" class="sem-dados">—</td>';
        }
      }
      body += '</tr>';
    }

    block2 =
      '<div class="op-block op-block2">' +
        '<div class="op-block-label">📈 Como evoluímos</div>' +
        '<table class="op-yoy-table">' +
          '<thead><tr>' + headHtml + '</tr></thead>' +
          '<tbody>' + body + '</tbody>' +
        '</table>' +
      '</div>';
  }

  var block3 = _buildBlock3Html(it, 'No SLA', 'Fora SLA');

  return {
    it: it,
    subHtml: subHtml,
    block1: block1,
    block2: block2,
    block3: block3,
    footer: _buildPeopleHtml(it),
  };
}


/* =========================================================
   MODAL — VALOR SIMPLES
   ========================================================= */
/* =========================================================
   MODAL — INDICADOR COMPOSTO
   ========================================================= */
/* =========================================================
   MODAL — INDICADOR COMPOSTO
   ========================================================= */
function _buildSimplesModalData(idx) {
  var entry = OP_ITEMS_INDEX[idx];
  if (!entry) return null;
  var it  = entry.item;
  var sec = entry.section;

  var fmtPrincipal = it.format || 'decimal';
  var fmtExtra     = it.format_extra || 'percent';
  var dec = (it.decimals !== undefined && it.decimals !== null && it.decimals !== '')
    ? parseInt(it.decimals) : 1;
  if (isNaN(dec)) dec = 1;

  function _fmt(v, fmt, d) {
    if (v === null || v === undefined || v === '') return '—';
    var s = String(v).trim();
    if (s === '' || s === '-' || s === '—') return '—';
    var num = parseNumber(v);
    if (isNaN(num)) return s;
    var br = function (n, dd) {
      return n.toLocaleString('pt-BR', {
        minimumFractionDigits: dd, maximumFractionDigits: dd
      });
    };
    var f  = fmt || 'decimal';
    var dd = (d !== undefined) ? d : 1;
    switch (f) {
      case 'integer':      return Math.round(num).toLocaleString('pt-BR');
      case 'percent':      return br(num, dd) + '%';
      case 'percent_frac': return br(num * 100, dd) + '%';
      case 'currency_brl': return 'R$ ' + br(num, dd);
      case 'currency_usd': return 'US$ ' + br(num, dd);
      case 'compact':
        var abs = Math.abs(num);
        if (abs >= 1e9) return br(num / 1e9, 1) + 'B';
        if (abs >= 1e6) return br(num / 1e6, 1) + 'M';
        if (abs >= 1e3) return br(num / 1e3, 1) + 'K';
        return String(Math.round(num));
      case 'raw':          return String(num);
      default:             return br(num, dd);
    }
  }

  var subParts = [];
  if (sec && sec.titulo) subParts.push(sec.titulo);
  if (it.pais && it.pais !== 'ambos') subParts.push('País: ' + it.pais);
  var subHtml = subParts.length
    ? '<span class="sub">' + subParts.join('  •  ') + '</span>' : '';

  /* ── HERO — valor principal com legenda ── */
  var heroHtml =
    '<div class="op-composto-modal-hero">' +
      '<div class="op-composto-modal-hero-value">' +
        _fmt(it.valor, fmtPrincipal, dec) +
      '</div>' +
      '<div class="op-composto-modal-hero-caption">Indicador</div>' +
      (it.fonte
        ? '<div class="op-composto-modal-hero-fonte">Fonte: ' +
          _escHtml(it.fonte) + '</div>'
        : '') +
    '</div>';

  /* ── BLOCO 1 — MÊS / YTD do valor principal ──
     Título fixo "Valor Principal" (não repete o label do header).
     Se só um dos dois existe, ativa classe `single` p/ centralizar. */
  var temMes = _fmt(it.mes, fmtPrincipal, dec) !== '—';
  var temYTD = _fmt(it.ytd, fmtPrincipal, dec) !== '—';
  var block1 = heroHtml;
  if (temMes || temYTD) {
    var ambos = temMes && temYTD;
    var gridCls = ambos ? '' : ' single';
    block1 +=
      '<div class="op-block op-block1 status-gray">' +
        '<div class="op-block-label">📌 Valor Principal</div>' +
        '<div class="op-composto-modal-grid' + gridCls + '">' +
          (temMes
            ? '<div class="op-composto-modal-card">' +
                '<div class="op-composto-modal-card-title">Mês</div>' +
                '<div class="op-composto-modal-card-value">' +
                  _fmt(it.mes, fmtPrincipal, dec) + '</div>' +
              '</div>'
            : '') +
          (temYTD
            ? '<div class="op-composto-modal-card">' +
                '<div class="op-composto-modal-card-title">YTD</div>' +
                '<div class="op-composto-modal-card-value">' +
                  _fmt(it.ytd, fmtPrincipal, dec) + '</div>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>';
  }

  /* ── BLOCO 2 — indicador secundário (opcional) ── */
  var extraTitulo = (it.label_extra || '').trim();
  var extraMes    = _fmt(it.valor_extra_mes, fmtExtra, dec);
  var extraYTD    = _fmt(it.valor_extra_ytd, fmtExtra, dec);
  var temExtraMes = extraMes !== '—';
  var temExtraYTD = extraYTD !== '—';
  var block2 = '';
  if (extraTitulo || temExtraMes || temExtraYTD) {
    var ambosEx = temExtraMes && temExtraYTD;
    var gridClsEx = ambosEx ? '' : ' single';
    block2 =
      '<div class="op-block op-block2">' +
        '<div class="op-block-label">📊 ' +
          _escHtml(extraTitulo || 'Indicador Secundário') + '</div>' +
        '<div class="op-composto-modal-grid' + gridClsEx + '">' +
          (temExtraMes
            ? '<div class="op-composto-modal-card gold">' +
                '<div class="op-composto-modal-card-title">Mês</div>' +
                '<div class="op-composto-modal-card-value">' + extraMes + '</div>' +
              '</div>'
            : '') +
          (temExtraYTD
            ? '<div class="op-composto-modal-card gold">' +
                '<div class="op-composto-modal-card-title">YTD</div>' +
                '<div class="op-composto-modal-card-value">' + extraYTD + '</div>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>';
  }

  /* ── BLOCO 3 — volumetria (opcional) ── */
  var volMes = _fmt(it.vol_mes, 'integer', 0);
  var volYTD = _fmt(it.vol_ytd, 'integer', 0);
  var temVolMes = volMes !== '—';
  var temVolYTD = volYTD !== '—';
  var block3 = '';
  if (temVolMes || temVolYTD) {
    var ambosVol = temVolMes && temVolYTD;
    var gridClsVol = ambosVol ? '' : ' single';
    block3 =
      '<div class="op-block op-block3">' +
        '<div class="op-block-label">📦 Volumetria</div>' +
        '<div class="op-composto-modal-grid' + gridClsVol + '">' +
          (temVolMes
            ? '<div class="op-composto-modal-card">' +
                '<div class="op-composto-modal-card-title">Mês</div>' +
                '<div class="op-composto-modal-card-value">' + volMes + '</div>' +
              '</div>'
            : '') +
          (temVolYTD
            ? '<div class="op-composto-modal-card">' +
                '<div class="op-composto-modal-card-title">YTD</div>' +
                '<div class="op-composto-modal-card-value">' + volYTD + '</div>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>';
  }

  return {
    it:      it,
    subHtml: subHtml,
    block1:  block1,
    block2:  block2,
    block3:  block3,
    footer:  _buildPeopleHtml(it),
  };
}

function _renderOpModalContent() {
  var overlay = document.getElementById('op-modal-overlay');
  if (!overlay) return;

  var data = _buildOpCardModalData(_opModalIndex);
  if (!data) return;

  var total  = OP_ITEMS_INDEX.length;
  var hasNav = total > 1;

  var navPrev = hasNav
    ? '<button class="op-modal-side-nav prev" onclick="navigateOpCard(-1)" ' +
      'title="Anterior (←)" aria-label="Anterior">&#10094;</button>'
    : '';
  var navNext = hasNav
    ? '<button class="op-modal-side-nav next" onclick="navigateOpCard(1)" ' +
      'title="Próximo (→)" aria-label="Próximo">&#10095;</button>'
    : '';
  var counterHtml = hasNav
    ? '<span class="op-modal-counter">' + (_opModalIndex + 1) +
      ' / ' + total + '</span>'
    : '';

  /* Monta o corpo (blocos opcionais) */
  var bodyHtml = data.block1 +
                 (data.block2 || '') +
                 (data.block3 || '');

  /* Rodapé — pessoas à esquerda, botão à direita */
  var footerPeople = data.footer || '';
  var footerHtml = footerPeople
    ? footerPeople
    : '<div class="op-footer-people"></div>';

  overlay.innerHTML =
    '<div class="op-modal">' +
      navPrev +
      navNext +
      '<div class="op-modal-header">' +
        '<div class="op-modal-header-info">' +
          '<h2>' + _escHtml(data.it.label) + counterHtml + '</h2>' +
          data.subHtml +
        '</div>' +
        '<button class="op-modal-close" onclick="closeOpCardModal()" ' +
                'title="Fechar (Esc)">&times;</button>' +
      '</div>' +
      '<div class="op-modal-body">' + bodyHtml + '</div>' +
      '<div class="op-modal-footer">' +
        footerHtml +
        '<button onclick="closeOpCardModal()" ' +
                'style="background:var(--navy); color:#fff; border:none; ' +
                'padding:9px 22px; border-radius:5px; font-size:11px; ' +
                'font-weight:800; text-transform:uppercase; ' +
                'letter-spacing:0.4px; cursor:pointer;">Fechar</button>' +
      '</div>' +
    '</div>';

  if (overlay.dataset.animated === '1') {
    var modal = overlay.querySelector('.op-modal');
    if (modal) modal.style.animation = 'none';
  }
  overlay.dataset.animated = '1';
}

function openOpCardModal(idx) {
  if (idx < 0 || idx >= OP_ITEMS_INDEX.length) return;
  _opModalIndex = idx;

  var existing = document.getElementById('op-modal-overlay');
  if (existing) {
    _renderOpModalContent();
    return;
  }

  var overlay = document.createElement('div');
  overlay.className = 'op-modal-overlay';
  overlay.id = 'op-modal-overlay';
  document.body.appendChild(overlay);

  _renderOpModalContent();

  overlay.addEventListener('mousedown', function(e) {
    if (e.target === overlay) closeOpCardModal();
  });

  var keyHandler = function(e) {
    if (!document.getElementById('op-modal-overlay')) return;
    if (e.key === 'Escape') {
      closeOpCardModal();
    } else if (e.key === 'ArrowLeft') {
      navigateOpCard(-1);
      e.preventDefault();
    } else if (e.key === 'ArrowRight') {
      navigateOpCard(1);
      e.preventDefault();
    }
  };
  document.addEventListener('keydown', keyHandler);
  overlay._escHandler = keyHandler;
}

function navigateOpCard(delta) {
  var total = OP_ITEMS_INDEX.length;
  if (total <= 1 || _opModalIndex < 0) return;
  _opModalIndex = (_opModalIndex + delta + total) % total;
  _renderOpModalContent();
}

function closeOpCardModal() {
  var overlay = document.getElementById('op-modal-overlay');
  if (!overlay) return;
  if (overlay._escHandler) {
    document.removeEventListener('keydown', overlay._escHandler);
  }
  _opModalIndex = -1;
  // ⭐ 'forwards' mantém o último keyframe (opacity:0) — sem isso, o
  // overlay pisca de volta para opacity:1 nos 140 ms antes de ser removido.
  overlay.style.animation = 'opOverlayIn 0.14s ease reverse forwards';
  setTimeout(function() {
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  }, 140);
}

/* =========================================================
   CONTROLE DE NAVEGAÇÃO
   ========================================================= */
var currentPage = 1;
var dashboardTimer = null;
var INTERVAL_MS = 30000;

function showPage(pageNum) {
  document.getElementById('page-1').classList.remove('active');
  document.getElementById('page-2').classList.remove('active');
  document.getElementById('btn-page-1').classList.remove('active');
  document.getElementById('btn-page-2').classList.remove('active');

  document.getElementById('page-' + pageNum).classList.add('active');
  document.getElementById('btn-page-' + pageNum).classList.add('active');
  currentPage = pageNum;
}

function autoNextPage() { showPage(currentPage === 1 ? 2 : 1); }

function startDashboardTimer() {
  if (dashboardTimer !== null) clearInterval(dashboardTimer);
  dashboardTimer = setInterval(autoNextPage, INTERVAL_MS);
}

function switchPage(pageNum) {
  if (pageNum === currentPage) return;
  showPage(pageNum);
}

/* =========================================================
   INIT
   ========================================================= */
document.addEventListener('DOMContentLoaded', function() {
  var el = document.getElementById('btn-view-BRPY');
  if (el) el.classList.add('active');

  renderAll();
  aplicarVisibilidadeSac();

  var _resizeDebounce = null;
  window.addEventListener('resize', function() {
    if (_resizeDebounce) clearTimeout(_resizeDebounce);
    _resizeDebounce = setTimeout(function() {
      renderVolumetria();
      _ativarMarquees();
    }, 150);
  });

  showPage(1);
});
  </script>
